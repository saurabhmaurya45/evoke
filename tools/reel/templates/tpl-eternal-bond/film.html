<!doctype html>
<html><head><meta charset="utf-8"><title>Eternal Bond Film</title>
<style>
@font-face{font-family:Brush;src:url("fonts/alex-brush-latin.woff2")}
@font-face{font-family:Play;src:url("fonts/playfair-display-latin.woff2");font-weight:400 900}
@font-face{font-family:Play;font-style:italic;src:url("fonts/playfair-display-italic-latin.woff2");font-weight:400 900}
@font-face{font-family:Corm;src:url("fonts/cormorant-garamond-latin.woff2");font-weight:300 700}
@font-face{font-family:Corm;font-style:italic;src:url("fonts/cormorant-garamond-italic-latin.woff2");font-weight:300 700}
@font-face{font-family:Mukta;src:url("fonts/mukta-400-latin.woff2");font-weight:400}
@font-face{font-family:Mukta;src:url("fonts/mukta-400-devanagari.woff2");font-weight:400;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Mukta;src:url("fonts/mukta-600-latin.woff2");font-weight:600}
@font-face{font-family:Mukta;src:url("fonts/mukta-600-devanagari.woff2");font-weight:600;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Rozha;src:url("fonts/rozha-one-latin.woff2")}
@font-face{font-family:Rozha;src:url("fonts/rozha-one-devanagari.woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px}
#stage{position:absolute;inset:0;overflow:hidden;background:#3d0d22}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0;transform-origin:center center}
.t{white-space:nowrap;text-align:center}
.t span{display:inline-block;white-space:pre}
canvas{position:absolute;left:0;top:0}
</style></head><body><div id="stage"></div>
<script src="../../lib/core.js"></script>
<script>
const D = window.__DATA;
const stage = document.querySelector('#stage');
const BEAT = 0.625, BAR = 2.5;

// ---- The template's palette: wine, rose, blush, cream and gold. ----
const WINE = '#4a1029', ROSE = '#8e1b46', BLUSH = '#f6d9df', CREAM = '#f7e7c3', GOLD = '#c9a24a', LGOLD = '#ecd28f';
const shadow = 'text-shadow:0 2px 14px rgba(40,0,15,.55);';
const NAME = 'Play,Mukta', BODY = 'Corm,Mukta', SCRIPT = 'Brush,Corm', HINDI = 'Rozha,Mukta', SANS = 'Mukta';

// A user photo that fails to load falls back to a soft rose gradient.
const GRAD = (() => {
  const c = document.createElement('canvas'); c.width = 96; c.height = 128;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 96, 128);
  g.addColorStop(0, '#e9b8c4'); g.addColorStop(1, '#8e1b46');
  x.fillStyle = g; x.fillRect(0, 0, 96, 128);
  return c.toDataURL('image/png');
})();

// ---- Data, used exactly as saved. A section with nothing in it is left out. ----
const groom = str(D.hero?.groomName), bride = str(D.hero?.brideName);
const parseDate = (v) => {
  const s = str(v).trim();
  if (!s) return null;
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? `${s}T00:00:00` : s);
  return Number.isNaN(d.getTime()) ? null : d;
};
const date = parseDate(D.hero?.date);
const left = date ? Math.max(0, Math.floor((date.getTime() - window.__NOW) / 1000)) : 0;
const FIN = [Math.floor(left / 86400), Math.floor((left % 86400) / 3600), Math.floor((left % 3600) / 60), left % 60];
const tagline = str(D.hero?.tagline).trim();
const famG = str(D.families?.groomFamily).trim(), famB = str(D.families?.brideFamily).trim();
const intro = str(D.story?.intro).trim().replace(/\s+/g, ' ');
const STORY_LABELS = { firstMet: 'First Met', firstJourney: 'First Journey', proposal: 'The Proposal', engagement: 'Engagement' };
const storyPhotos = Object.keys(STORY_LABELS).map((k) => [STORY_LABELS[k], safeImage(D.storyPhotos?.[k])]).filter(([, u]) => u);
const venueName = str(D.venue?.name).trim(), venueAddr = str(D.venue?.address).trim();
const GALLERY_KEYS = ['walking', 'handsJoined', 'dancing', 'laughing', 'candlelight', 'palace'];
const moments = GALLERY_KEYS.map((k) => safeImage(D.gallery?.[k])).filter(Boolean);
const hidden = safeImage(D.reveal?.hidden);

// ---- The cut list: whole bars, so any section may follow any and stay on the beat. ----
const SEGS = [];
const add = (key, dur, enter) => SEGS.push({ key, dur, enter });
add('env', 2 * BAR, null);
add('card', 2 * BAR, 'card');
if (famG || famB) add('fam', BAR, 'seal');
if (left > 0) add('count', BAR, 'flip');
if (intro || storyPhotos.length) add('story', storyPhotos.length > 1 ? 2 * BAR : BAR, 'arch');
if (venueName) add('venue', BAR, 'push');
if (moments.length) add('moments', moments.length > 3 ? 2 * BAR : BAR, 'heart');
if (hidden) add('reveal', BAR, 'foil');
add('end', 2 * BAR, 'bloom');
let acc = 0;
SEGS.forEach((s) => { s.start = acc; acc += s.dur; });
const TOTAL = acc;
const startOf = (k) => SEGS.find((s) => s.key === k)?.start;
const TR = {
  card: { post: 0.45 }, seal: { post: 0.5 }, flip: { post: 0.5 }, arch: { post: 0.55 },
  push: { post: 0.5 }, heart: { post: 0.55 }, foil: { post: 0.55 }, bloom: { post: 0.3 },
};

// ---- Helpers ----
const R = {};
function wine(sc) {
  return mk(sc, 'div', `width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 38%,#7a1f45 0%,${WINE} 48%,#2a0716 100%)`);
}
function blush(sc) {
  const b = mk(sc, 'div', `width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 36%,#fde9ee 0%,${BLUSH} 55%,#eab9c5 100%)`);
  // The template's dotted paper texture.
  mk(sc, 'div', 'width:1080px;height:1920px;opacity:.35;background-image:radial-gradient(rgba(142,27,70,.28) 1.2px,transparent 1.6px);background-size:34px 34px');
  return b;
}
// Script heading with the template's rose rule and diamond beneath it.
function heading(sc, s, y, color = ROSE) {
  const h = text(sc, s, `font:400 132px ${SCRIPT};color:${color}`, 900);
  const l = mk(sc, 'div', `width:440px;height:2px;background:linear-gradient(90deg,transparent,${color} 30%,${color} 70%,transparent)`);
  const d = mk(sc, 'div', `width:16px;height:16px;background:${color}`);
  return (u, start = 0.05) => {
    const p = outC(seg(u, start, start + 0.7));
    P(h, { y, a: p, b: (1 - p) * 8 });
    h.style.clipPath = `inset(-30% ${(1 - p) * 100}% -30% -5%)`;
    P(l, { y: y + 100, a: seg(u, start + 0.3, start + 0.6) });
    l.style.transform += ` scaleX(${outC(seg(u, start + 0.3, start + 0.8))})`;
    P(d, { y: y + 100, r: 45 + (1 - outB(seg(u, start + 0.45, start + 0.85), 2)) * 180, s: Math.max(0.001, outB(seg(u, start + 0.45, start + 0.85), 2)) });
  };
}
function lines(value, max, count) {
  const out = [];
  for (const w of str(value).trim().split(/\s+/).filter(Boolean)) {
    const last = out[out.length - 1];
    if (last !== undefined && (last + ' ' + w).length <= max) out[out.length - 1] = `${last} ${w}`;
    else out.push(w);
  }
  if (out.length > count) { out.length = count; out[count - 1] = out[count - 1].replace(/[,.;:!?]*$/, '') + '…'; }
  return out;
}
const photo = (parent, url, w, h, extra = '') => im(parent, url, w, h, `object-fit:cover;${extra}`, GRAD);
const hindiDate = (d) => {
  try {
    const f = new Intl.DateTimeFormat('hi-IN-u-nu-deva', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
    const w = new Intl.DateTimeFormat('hi-IN', { weekday: 'long' }).format(d);
    return `${f} · ${w}`;
  } catch { return ''; }
};

// ================= Scenes (in cut order, so a later scene draws over an earlier one) =================

// ---- The envelope ----
const CARD_RECT = { w: 0, h: 0, x: 540, y: 0 };
{
  const sc = scene(stage);
  wine(sc);
  const cam = mk(sc, 'div', 'width:1080px;height:1920px');
  const W = 840, H = 580, X = 540, Y = 960;
  const back = mk(cam, 'div', `width:${W}px;height:${H}px;border-radius:14px;background:linear-gradient(170deg,#e8cf95,#cfae62);box-shadow:0 40px 90px rgba(0,0,0,.45)`);
  const card = mk(cam, 'div', `width:${W - 120}px;height:${H - 60}px;border-radius:12px;background:linear-gradient(170deg,#c77a93,#9c3b5c);border:2px solid rgba(255,230,200,.5)`);
  const cSeal = mk(card, 'div', `left:${(W - 120) / 2 - 56}px;top:70px;width:112px;height:112px;border-radius:50%;border:3px solid ${LGOLD};box-shadow:0 0 0 10px rgba(236,210,143,.18)`);
  mk(cSeal, 'div', `left:26px;top:26px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d0457a,#7a1238)`);
  const front = mk(cam, 'div', `width:${W}px;height:${H}px;border-radius:14px;background:linear-gradient(170deg,#f6e3b4,#e2c47e);clip-path:polygon(0 18%,50% 58%,100% 18%,100% 100%,0 100%)`);
  mk(front, 'div', `left:0;top:0;width:${W}px;height:${H}px;opacity:.5;background-image:radial-gradient(rgba(150,110,40,.5) 1.3px,transparent 1.8px);background-size:22px 22px`);
  const flap = mk(cam, 'div', `width:${W}px;height:${H * 0.58}px;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#f3dda6,#e3c57f)`);
  mk(flap, 'div', `left:0;top:0;width:${W}px;height:${H * 0.58}px;opacity:.5;background-image:radial-gradient(rgba(150,110,40,.5) 1.3px,transparent 1.8px);background-size:22px 22px`);
  const seal = mk(cam, 'div', `width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c23a6c,#8e1b46 55%,#5c0d2b);box-shadow:0 10px 26px rgba(60,0,20,.55),inset 0 -6px 14px rgba(0,0,0,.35)`);
  const shri = mk(seal, 'div', `left:0;right:0;top:34px;text-align:center;font:400 78px/1 ${HINDI};color:#ffe9c9`);
  shri.textContent = 'श्री';
  const ring = mk(cam, 'div', `width:200px;height:200px;border-radius:50%;border:4px solid ${LGOLD}`);
  const cap = text(sc, 'Tap the seal to open the invitation', `font:400 40px ${SANS};letter-spacing:5px;color:#f4d8c8`, 940);
  R.env = { sc, f(u) {
    const open = seg(u, 2.5, 3.1), rise = ioC(seg(u, 3.05, 3.9)), push = inC(seg(u, 3.85, 5.0));
    const bob = Math.sin(u * 1.8) * 10;
    const pulse = u < 2.5 ? 1 + 0.07 * Math.exp(-((u % BEAT)) * 8) : 1;
    // The camera pushes in on the card until it fills the screen.
    const s = 1 + push * 1.25, ty = -push * 120;
    cam.style.transform = `translateY(${ty}px) scale(${s})`;
    P(back, { x: X, y: Y + bob });
    const cy = Y + bob - rise * 420;
    // Hidden until the flap is up, so it never shows through the closed envelope.
    P(card, { x: X, y: cy + 10, a: u >= 2.75 ? 1 : 0 });
    P(front, { x: X, y: Y + bob, a: 1 - push });
    // The flap swings up and over, in 3D.
    P(flap, { x: X, y: Y + bob - H / 2 + (H * 0.58) / 2 });
    flap.style.transformOrigin = '50% 0';
    flap.style.transform = `translate(${X}px,${Y + bob - H / 2}px) translate(-50%,0) perspective(1600px) rotateX(${-ioC(open) * 178}deg)`;
    flap.style.filter = `brightness(${1 - 0.35 * Math.sin(open * Math.PI)})`;
    const crack = seg(u, 2.5, 2.8);
    P(seal, { x: X, y: Y + bob - H / 2 + H * 0.58 - 40, s: pulse * (1 + crack * 0.25), a: 1 - crack });
    P(ring, { x: X, y: Y + bob - H / 2 + H * 0.58 - 40, s: u < 2.5 ? 1 + ((u % BEAT) / BEAT) * 0.5 : 1 + crack * 2, a: u < 2.5 ? (1 - (u % BEAT) / BEAT) * 0.7 : (1 - crack) * 0.7 });
    P(cap, { y: 1390, a: (0.55 + 0.45 * Math.sin(u * 3)) * (1 - seg(u, 2.4, 2.7)) });
    // Where the card is on screen when this scene hands over to it.
    CARD_RECT.w = (W - 120) * s; CARD_RECT.h = (H - 60) * s;
    CARD_RECT.y = 960 + (cy + 10 - 960) * s + ty;
  } };
}

// ---- Shubh vivah card ----
{
  const sc = scene(stage);
  wine(sc);
  const glowL = mk(sc, 'div', 'width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,200,.28),transparent 65%)');
  const card = mk(sc, 'div', 'width:900px;height:1160px;border-radius:26px;background:linear-gradient(170deg,rgba(255,236,242,.2),rgba(255,214,228,.08));border:2px solid rgba(255,225,235,.45);box-shadow:0 30px 90px rgba(20,0,10,.45),inset 0 0 60px rgba(255,220,235,.12);backdrop-filter:blur(2px)');
  const ganesh = text(sc, '॥ श्री गणेशाय नमः ॥', `font:400 40px ${SANS};letter-spacing:6px;color:${LGOLD}`, 820);
  const shubh = text(sc, 'शुभ विवाह', `font:400 92px ${HINDI};color:#ffc9d8;${shadow}`, 820);
  const nameCss = `font:600 128px ${NAME};color:#fff7f2;${shadow}`;
  const nG = text(sc, groom, nameCss, 820);
  const weds = text(sc, 'weds', `font:400 96px ${SCRIPT};color:#ffb0c8;${shadow}`);
  const nB = text(sc, bride, nameCss, 820);
  const div = text(sc, '✦  ◇  ✦', `font:400 34px ${SANS};color:${LGOLD}`);
  const en = date ? text(sc, date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), `font:500 64px ${BODY};color:#fff1e6;${shadow}`, 820) : null;
  const hi = date ? text(sc, hindiDate(date), `font:400 46px ${SANS};color:${LGOLD};${shadow}`, 820) : null;
  const tag = lines(tagline, 34, 2).filter(Boolean).map((l) => text(sc, l, `font:italic 500 50px ${BODY};color:#ffdbe6;${shadow}`, 820));
  const rows = [ganesh, shubh, nG, weds, nB, div, en, hi, ...tag].filter(Boolean);
  const gaps = { [rows.indexOf(shubh)]: 120, [rows.indexOf(nG)]: 150, [rows.indexOf(weds)]: 118, [rows.indexOf(nB)]: 118, [rows.indexOf(div)]: 110 };
  const ys = []; let y = 0;
  rows.forEach((r, i) => { y += i === 0 ? 0 : gaps[i] ?? 80; ys.push(y); });
  const top = 900 - y / 2;
  R.card = { sc, f(u) {
    sc.style.transform = `scale(${1.04 - u * 0.008})`;
    P(glowL, { y: 820, s: 1 + 0.05 * Math.sin(u * 2), a: 0.9 });
    P(card, { y: 900 });
    rows.forEach((r, i) => {
      const at = 0.15 + i * 0.22;
      P(r, { y: top + ys[i] });
      if (r === nG || r === nB) reveal(r, u, at, 0.045, 0.5, 70);
      else if (r === weds) { P(r, { y: top + ys[i], s: lerp(0.3, 1, outB(seg(u, at, at + 0.45), 2)), a: cl(seg(u, at, at + 0.2)) }); r.style.clipPath = `inset(-30% ${(1 - outC(seg(u, at, at + 0.6))) * 100}% -30% -5%)`; }
      else reveal(r, u, at, 0.02, 0.4, 30);
    });
  } };
}

// ---- With love, the families ----
{
  const sc = scene(stage);
  blush(sc);
  const love = text(sc, 'With love,', `font:400 150px ${SCRIPT};color:${ROSE}`, 900);
  const fams = famG && famB ? `the ${famG} & ${famB} families` : `the ${famG || famB} family`;
  const fl = lines(fams, 22, 3).map((l) => text(sc, l, `font:600 78px ${NAME};color:${WINE}`, 940));
  const mono = [famG, famB].filter(Boolean).map((f) => {
    const m = mk(sc, 'div', `width:190px;height:190px;border-radius:50%;border:3px solid ${GOLD};background:rgba(255,250,246,.7);box-shadow:0 10px 30px rgba(142,27,70,.18)`);
    const l = mk(m, 'div', `left:0;right:0;top:44px;text-align:center;font:600 86px/1 ${NAME};color:${ROSE}`);
    l.textContent = graphemes(f)[0].toUpperCase();
    return m;
  });
  R.fam = { sc, f(u) {
    const join = outB(seg(u, 0.2, 0.9), 1.4);
    mono.forEach((m, i) => {
      const side = mono.length === 1 ? 0 : i ? 1 : -1;
      P(m, { x: 540 + side * lerp(520, 78, join), y: 640, r: side * (1 - join) * 40, a: cl(seg(u, 0.1, 0.4)) });
    });
    P(love, { y: 900 }); love.style.clipPath = `inset(-30% ${(1 - outC(seg(u, 0.55, 1.2))) * 100}% -30% -5%)`;
    fl.forEach((e, i) => { P(e, { y: 1060 + i * 96 }); reveal(e, u, 0.95 + i * 0.15, 0.025, 0.4, 40); });
  } };
}

// ---- Countdown: the template's round circles ----
{
  const sc = scene(stage);
  wine(sc);
  const title = text(sc, 'Counting every moment', `font:400 120px ${SCRIPT};color:#ffc9d8;${shadow}`, 960);
  const sub = date ? text(sc, date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), `font:500 56px ${BODY};color:#fff1e6;${shadow}`, 900) : null;
  const circles = ['DAYS', 'HOURS', 'MINS', 'SECS'].map((lab) => {
    const c = mk(sc, 'div', `width:212px;height:212px;border-radius:50%;border:3px solid rgba(255,214,228,.7);background:rgba(255,230,240,.08);box-shadow:0 0 30px rgba(255,170,200,.2)`);
    c.v = mk(c, 'div', `left:0;right:0;top:40px;text-align:center;font:500 92px/1 ${NAME};color:#fff7f2`);
    const l = mk(c, 'div', `left:0;right:0;top:142px;text-align:center;font:600 26px ${SANS};letter-spacing:5px;color:${LGOLD}`);
    l.textContent = lab;
    return c;
  });
  const settle = [0.95, 1.25, 1.55, 1.875];
  R.count = { sc, f(u) {
    P(title, { y: 560 }); title.style.clipPath = `inset(-30% ${(1 - outC(seg(u, 0.05, 0.7))) * 100}% -30% -5%)`;
    if (sub) { P(sub, { y: 700 }); reveal(sub, u, 0.4, 0.02, 0.35, 30); }
    circles.forEach((c, i) => {
      const p = seg(u, 0.3 + i * 0.1, 0.8 + i * 0.1), done = u >= settle[i];
      const spin = Math.sin(i * 91.7 + Math.floor(u * 22) * 13.1) * 43758.5;
      let v = done ? FIN[i] : Math.floor((spin - Math.floor(spin)) * [100, 24, 60, 60][i]);
      if (i === 3 && done) v = (FIN[3] - Math.floor(u - settle[3]) + 60) % 60;
      c.v.textContent = String(v).padStart(2, '0');
      c.v.style.fontSize = `${[92, 92, 92, 76, 60, 50][Math.min(c.v.textContent.length, 5)]}px`;
      P(c, { x: 180 + i * 240, y: 960, s: outB(p, 1.6) * (done ? 1 + 0.1 * Math.exp(-(u - settle[i]) * 9) : 1), a: cl(p * 3) });
    });
  } };
}

// ---- Our story ----
{
  const sc = scene(stage);
  blush(sc);
  const head = heading(sc, 'Our Story', 330);
  const n = storyPhotos.length;
  const text1 = lines(intro, n ? 32 : 26, n ? 3 : 6).map((l) => text(sc, l, `font:italic 500 ${n ? 50 : 60}px ${BODY};color:${WINE}`, 920));
  const textTop = n ? 520 : 960 - ((text1.length - 1) * 84) / 2;
  const arches = storyPhotos.map(([label, url]) => {
    const f = mk(sc, 'div', 'width:500px;height:680px;border-radius:250px 250px 22px 22px;background:#fff;box-shadow:0 22px 60px rgba(120,20,60,.28)');
    const hole = mk(f, 'div', 'left:16px;top:16px;width:468px;height:648px;border-radius:234px 234px 14px 14px;overflow:hidden');
    f.img = photo(hole, url, 468, 648);
    f.cap = text(sc, label, `font:600 60px ${NAME};color:${ROSE}`, 600);
    return f;
  });
  R.story = { sc, f(u, s) {
    head(u);
    text1.forEach((e, i) => { const p = outC(seg(u, 0.3 + i * 0.14, 0.9 + i * 0.14)); P(e, { y: textTop + i * (n ? 70 : 84) + (1 - p) * 30, a: p, b: (1 - p) * 6 }); });
    if (!n) return;
    // Each photo holds a whole number of beats, and the next glides in on the beat.
    const step = n > 1 ? Math.max(BEAT, Math.floor(s.dur / n / BEAT) * BEAT) : s.dur;
    const pos = cl(u / step, 0, n - 1);
    const k = Math.floor(pos), f = ioC(cl((pos - k) * 3 - 2)), cur = k + f; // glide in the last third of each step
    arches.forEach((a, i) => {
      const d = i - cur, ad = Math.abs(d);
      const enter = i === 0 ? outB(seg(u, 0.35, 0.95), 1.2) : 1;
      P(a, { x: 540 + d * 470, y: 1180 + (1 - enter) * 900 + ad * 40, s: lerp(1, 0.72, cl(ad)), a: cl(1.6 - ad) * cl(enter * 3), ry: -d * 18 });
      a.img.style.transform = `scale(${1.1 - cl(u / s.dur) * 0.08})`;
      P(a.cap, { y: 1600, a: cl(1 - ad * 2) * cl(seg(u, 0.35, 0.6)) });
    });
  } };
}

// ---- Venue ----
{
  const sc = scene(stage);
  blush(sc);
  const head = heading(sc, 'Venue', 330);
  const map = mk(sc, 'div', 'width:820px;height:560px;border-radius:26px;overflow:hidden;background:#fbf2ec;box-shadow:0 22px 60px rgba(120,20,60,.22);border:2px solid rgba(142,27,70,.18)');
  const mc = mk(map, 'canvas', '');
  mc.width = 820; mc.height = 560;
  const g = mc.getContext('2d'), r = rng(9);
  g.fillStyle = '#dff0e0'; g.beginPath(); g.ellipse(160, 120, 170, 110, 0.3, 0, 6.3); g.fill();
  g.fillStyle = '#d9eaf7'; g.beginPath(); g.ellipse(690, 460, 200, 120, -0.2, 0, 6.3); g.fill();
  for (let i = 0; i < 14; i++) {
    g.strokeStyle = i < 4 ? '#f2c9a8' : '#ead9d2'; g.lineWidth = i < 4 ? 16 : 7;
    g.beginPath(); g.moveTo(r() * 820, -20);
    g.bezierCurveTo(r() * 820, r() * 560, r() * 820, r() * 560, r() * 820, 580); g.stroke();
  }
  const pin = mk(sc, 'div', `width:110px;height:110px;border-radius:50% 50% 50% 0;transform-origin:50% 50%;background:radial-gradient(circle at 40% 35%,#c23a6c,${ROSE} 60%,#5c0d2b)`);
  mk(pin, 'div', `left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:${LGOLD}`);
  const rip = [0, 1, 2].map(() => mk(sc, 'div', `width:180px;height:70px;border-radius:50%;border:4px solid ${ROSE}`));
  const vn = lines(venueName, 24, 2).map((l) => text(sc, l, `font:600 70px ${NAME};color:${WINE}`, 940));
  const va = lines(venueAddr, 36, 2).filter(Boolean).map((l) => text(sc, l, `font:500 46px ${BODY};color:${ROSE}`, 920));
  R.venue = { sc, f(u) {
    head(u);
    const mp = outC(seg(u, 0.2, 0.7));
    P(map, { y: 820 + (1 - mp) * 120, a: mp, s: lerp(0.94, 1, mp) });
    mc.style.transform = `scale(${1.08 - u * 0.02}) translate(${-u * 6}px,0)`;
    const drop = seg(u, 0.75, 1.15), land = u >= 1.15;
    const py = lerp(380, 780, outB(drop, 1.1)) + (land ? -Math.abs(Math.sin((u - 1.15) * 7)) * 22 * Math.exp(-(u - 1.15) * 3) : 0);
    pin.style.transform = `translate(540px,${py}px) translate(-50%,-100%) rotate(-45deg)`;
    pin.style.opacity = cl(drop * 4);
    rip.forEach((e, i) => {
      const w = (((u - 1.15 - i * 0.2) % BEAT) + BEAT) % BEAT / BEAT;
      P(e, { y: 800, s: 0.4 + w * 1.6, a: land ? (1 - w) * 0.7 : 0 });
    });
    vn.forEach((e, i) => { P(e, { y: 1210 + i * 86 }); reveal(e, u, 1.0 + i * 0.12, 0.025, 0.4, 40); });
    va.forEach((e, i) => { P(e, { y: 1210 + vn.length * 86 + 10 + i * 60, a: outC(seg(u, 1.35 + i * 0.1, 1.75 + i * 0.1)) }); });
  } };
}

// ---- Moments: photos carried up by balloons ----
{
  const sc = scene(stage);
  blush(sc);
  const head = heading(sc, 'Moments', 300);
  const BAL = ['#e2577f', '#8e1b46', '#d9b25a', '#f19ab3'];
  const items = moments.map((url, i) => {
    const g = mk(sc, 'div', 'width:640px;height:1060px');
    const cv = mk(g, 'canvas', '');
    cv.width = 640; cv.height = 300;
    const c = cv.getContext('2d');
    // Three balloons on strings, drawn once.
    [[200, 150, BAL[i % 4]], [320, 110, BAL[(i + 1) % 4]], [440, 150, BAL[(i + 2) % 4]]].forEach(([x, y, col]) => {
      c.strokeStyle = 'rgba(120,40,70,.55)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y + 62); c.quadraticCurveTo(x + (320 - x) * 0.4, y + 140, 320, 300); c.stroke();
      const gr = c.createRadialGradient(x - 16, y - 22, 6, x, y, 70);
      gr.addColorStop(0, '#fff'); gr.addColorStop(0.18, col); gr.addColorStop(1, col);
      c.fillStyle = gr; c.beginPath(); c.ellipse(x, y, 52, 64, 0, 0, 6.3); c.fill();
    });
    const fr = mk(g, 'div', 'left:40px;top:296px;width:560px;height:740px;border-radius:24px;background:#fff;box-shadow:0 24px 60px rgba(120,20,60,.3)');
    const hole = mk(fr, 'div', 'left:16px;top:16px;width:528px;height:708px;border-radius:14px;overflow:hidden');
    g.img = photo(hole, url, 528, 708);
    return g;
  });
  R.moments = { sc, f(u, s) {
    head(u);
    const step = Math.max(BEAT, Math.floor((s.dur - 0.3) / items.length / BEAT) * BEAT);
    items.forEach((g, i) => {
      const t0 = 0.3 + i * step, p = seg(u, t0, t0 + 0.6), q = i < items.length - 1 ? seg(u, t0 + step, t0 + step + 0.6) : 0;
      g.style.display = u >= t0 - 0.02 && q < 1 ? 'block' : 'none';
      const sway = Math.sin((u - t0) * 2.4 + i) * 4;
      P(g, { y: 1080 + (1 - outC(p)) * 1500 - inC(q) * 1700, r: sway + (1 - p) * (i % 2 ? 8 : -8) });
      g.img.style.transform = `scale(${1.06 + (u - t0) * 0.04})`;
    });
  } };
}

// ---- Scratch to reveal ----
{
  const sc = scene(stage);
  blush(sc);
  const head = heading(sc, 'Scratch to Reveal', 300);
  const S = 760;
  const box = mk(sc, 'div', `width:${S}px;height:${S}px;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(120,20,60,.3)`);
  const img = photo(box, hidden || GRAD, S, S);
  const foil = mk(box, 'canvas', '');
  foil.width = S; foil.height = S;
  const f = foil.getContext('2d');
  const coin = mk(sc, 'div', `width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,${GOLD} 55%,#8a6a1c);box-shadow:0 0 30px rgba(255,220,140,.9)`);
  const path = (p) => { const rows = 6, k = p * rows, r = Math.floor(k), x = r % 2 ? 1 - (k - r) : k - r; return [60 + x * (S - 120), 70 + (Math.min(r, rows - 1) + (k - r)) * ((S - 140) / rows)]; };
  const paintFoil = () => {
    f.globalCompositeOperation = 'source-over';
    const g = f.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, '#e9c86a'); g.addColorStop(0.5, '#f7e3a0'); g.addColorStop(1, '#c9a24a');
    f.fillStyle = g; f.fillRect(0, 0, S, S);
    f.fillStyle = 'rgba(150,110,40,.4)';
    for (let y = 12; y < S; y += 22) for (let x = 12; x < S; x += 22) { f.beginPath(); f.arc(x, y, 1.6, 0, 6.3); f.fill(); }
    f.fillStyle = '#8a6a1c'; f.font = `600 40px ${SANS}`; f.textAlign = 'center';
    f.fillText('✦  SCRATCH HERE  ✦', S / 2, S / 2 + 14);
  };
  R.reveal = { sc, f(u) {
    head(u);
    P(box, { y: 1000, s: lerp(0.9, 1, outB(seg(u, 0.15, 0.6), 1.4)), a: cl(seg(u, 0.15, 0.35)) });
    paintFoil();
    const p = seg(u, 0.65, 1.95);
    f.globalCompositeOperation = 'destination-out';
    f.lineCap = 'round'; f.lineJoin = 'round'; f.lineWidth = 150;
    f.beginPath();
    for (let i = 0; i <= 80; i++) { const [x, y] = path((i / 80) * p); i ? f.lineTo(x, y) : f.moveTo(x, y); }
    if (p > 0) f.stroke();
    if (u > 1.95) f.clearRect(0, 0, S, S);
    const [cx, cy] = path(p);
    P(coin, { x: 540 - S / 2 + cx, y: 1000 - S / 2 + cy, a: p > 0 && p < 1 ? 1 : 0, r: u * 400 });
    img.style.transform = `scale(${1.12 - seg(u, 1.9, 2.5) * 0.08})`;
  } };
}

// ---- End card ----
{
  const sc = scene(stage);
  wine(sc);
  const halo = mk(sc, 'div', 'width:1100px;height:520px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,180,205,.45),transparent 68%)');
  // The brand logo, and nothing else.
  const logo = im(sc, '../../lib/watermark-logo.png', 820, 820 * 227 / 640);
  R.end = { sc, f(u) {
    const l = outB(seg(u, 0.15, 0.75), 1.9);
    P(halo, { y: 960, s: l * (1 + 0.05 * Math.sin(u * 5)), a: cl(l) * 0.9 });
    P(logo, { y: 960, s: Math.max(l, 0.001), a: cl(l * 2) });
    logo.style.filter = 'drop-shadow(0 4px 14px rgba(0,0,0,.45))';
  } };
}

// ================= Transitions =================
const deco = {
  ring: mk(stage, 'div', `border-radius:50%;border:10px solid ${ROSE};box-shadow:0 0 0 4px ${LGOLD},0 0 40px rgba(142,27,70,.6)`),
  arch: mk(stage, 'div', 'border:8px solid #fff;box-shadow:0 0 40px rgba(255,255,255,.7)'),
  foil: mk(stage, 'div', 'width:300px;height:3400px;background:linear-gradient(90deg,transparent,#c9a24a 15%,#fff3c4 50%,#c9a24a 85%,transparent)'),
  edge: mk(stage, 'div', 'width:1080px;height:60px;background:linear-gradient(180deg,rgba(60,0,20,.35),transparent)'),
  heart: (() => { const e = mk(stage, 'canvas', ''); e.width = 1080; e.height = 1920; return e; })(),
};
Object.values(deco).forEach((e) => { e.style.display = 'none'; });
const heartPoints = (k) => {
  // A heart centred on the screen, k times the size of a 100px one.
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * Math.PI * 2;
    const x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push([540 + x * k * 3.1, 960 + y * k * 3.1]);
  }
  return pts;
};
const heartPath = (k) => `polygon(${heartPoints(k).map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')})`;
function transition(el, type, p) {
  el.style.clipPath = ''; el.style.opacity = ''; el.style.filter = '';
  if (!(p > 0 && p < 1)) return;
  const e = outC(p);
  if (type === 'card') {
    const w = lerp(CARD_RECT.w, 1080, e), h = lerp(CARD_RECT.h, 1920, e), y = lerp(CARD_RECT.y, 960, e);
    el.style.clipPath = `inset(${y - h / 2}px ${(1080 - w) / 2}px ${1920 - y - h / 2}px ${(1080 - w) / 2}px round ${lerp(14, 0, e)}px)`;
  }
  if (type === 'bloom') el.style.opacity = cl(p * 1.6);
  if (type === 'seal') {
    const r = lerp(0, 1250, e);
    el.style.clipPath = `circle(${r}px at 540px 960px)`;
    deco.ring.style.display = 'block'; deco.ring.style.width = deco.ring.style.height = `${r * 2}px`;
    P(deco.ring, { y: 960, a: 1 - p * 0.5 });
  }
  if (type === 'flip') el.style.transform = `perspective(2200px) rotateY(${(1 - e) * 90}deg)`;
  if (type === 'arch') {
    const w = lerp(120, 1500, e), h = lerp(160, 2400, e), top = 1920 - h, l = 540 - w / 2;
    el.style.clipPath = `inset(${top}px ${1080 - l - w}px 0 ${l}px round ${w / 2}px ${w / 2}px 0 0)`;
    deco.arch.style.display = 'block';
    Object.assign(deco.arch.style, { width: `${w}px`, height: `${h}px`, borderRadius: `${w / 2}px ${w / 2}px 0 0` });
    P(deco.arch, { y: 1920 - h / 2, a: 1 - p * 0.5 });
  }
  if (type === 'push') {
    el.style.transform = `translateY(${(1 - e) * 1920}px)`;
    deco.edge.style.display = 'block'; P(deco.edge, { y: (1 - e) * 1920 - 30 });
  }
  if (type === 'heart') {
    const k = lerp(0.05, 9, inC(p) * 0.4 + e * 0.6);
    el.style.clipPath = heartPath(k);
    // A glowing rose outline, so the heart reads on the blush background.
    const h = deco.heart, g = h.getContext('2d');
    h.style.display = 'block';
    g.clearRect(0, 0, 1080, 1920);
    g.beginPath(); heartPoints(k).forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.strokeStyle = ROSE; g.lineWidth = 10; g.shadowColor = '#ff8fb1'; g.shadowBlur = 40; g.globalAlpha = 1 - p * 0.4; g.stroke();
    g.strokeStyle = LGOLD; g.lineWidth = 3; g.shadowBlur = 0; g.stroke(); g.globalAlpha = 1;
  }
  if (type === 'foil') {
    const x = lerp(-700, 2100, e);
    el.style.clipPath = `polygon(0 0,${x}px 0,${x - 1100}px 1920px,0 1920px)`;
    deco.foil.style.display = 'block'; P(deco.foil, { x: x - 550, y: 960, r: 29.8 });
  }
}

// ================= Petals, fairy lights, balloons, light =================
const cv = document.createElement('canvas');
cv.width = 1080; cv.height = 1920;
stage.appendChild(cv);
const c = cv.getContext('2d');
mk(stage, 'div', 'width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 46%,transparent 60%,rgba(30,0,12,.45) 100%)');
const flash = mk(stage, 'div', 'width:1080px;height:1920px');
const RN = rng(23);
const PET = ['#e25a5a', '#f08aa0', '#f2a24a', '#c9334f', '#f6b8c4'];
const petals = Array.from({ length: 60 }, () => ({ x: RN() * 1080, y: RN() * 2200, v: 150 + RN() * 200, sw: 30 + RN() * 70, f: 0.6 + RN() * 1.2, p: RN() * 6.28, w: 10 + RN() * 12, c: PET[Math.floor(RN() * 5)], rs: 1 + RN() * 3 }));
const BCOL = ['#e2577f', '#8e1b46', '#d9b25a', '#f19ab3'];
const balloons = Array.from({ length: 12 }, (_, i) => ({ x: i % 2 ? 900 + RN() * 150 : RN() * 170, y: RN() * 2400, v: 90 + RN() * 70, s: 0.6 + RN() * 0.5, c: BCOL[i % 4], p: RN() * 6.28 }));
const bulbs = Array.from({ length: 13 }, (_, i) => i);
const ON = (k) => SEGS.find((s) => s.key === k);
const lightsFrom = startOf('card');

function fx(T) {
  c.clearRect(0, 0, 1080, 1920);
  const inSeg = (k) => { const s = ON(k); return s && T >= s.start && T < s.start + s.dur; };
  const wineScene = inSeg('env') || inSeg('card') || inSeg('count') || inSeg('end');
  // Petals over the wine scenes, as on the envelope screen.
  if (wineScene) {
    c.globalAlpha = 0.85;
    for (const p of petals) {
      const y = (p.y + T * p.v) % 2200 - 140, x = p.x + Math.sin(T * p.f + p.p) * p.sw, sq = 0.3 + 0.7 * Math.abs(Math.sin(T * p.rs + p.p));
      c.save(); c.translate(x, y); c.rotate(T * p.rs * 0.6 + p.p); c.scale(1, sq);
      c.fillStyle = p.c; c.beginPath(); c.ellipse(0, 0, p.w, p.w * 0.6, 0, 0, 6.3); c.fill();
      c.restore();
    }
    c.globalAlpha = 1;
  }
  // Balloons drifting up the sides once the card is out.
  if (T >= lightsFrom && wineScene) {
    const a = seg(T, lightsFrom + 0.5, lightsFrom + 1.5) * 0.9;
    for (const b of balloons) {
      const y = 2100 - ((b.y + (T - lightsFrom) * b.v) % 2400), x = b.x + Math.sin(T * 0.9 + b.p) * 24, rw = 46 * b.s, rh = 58 * b.s;
      c.globalAlpha = a;
      c.strokeStyle = 'rgba(255,230,240,.45)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(x, y + rh); c.quadraticCurveTo(x + 14, y + rh + 70, x - 6, y + rh + 150); c.stroke();
      const g = c.createRadialGradient(x - rw * 0.35, y - rh * 0.4, 3, x, y, rh * 1.1);
      g.addColorStop(0, '#fff'); g.addColorStop(0.2, b.c); g.addColorStop(1, b.c);
      c.fillStyle = g; c.beginPath(); c.ellipse(x, y, rw, rh, 0, 0, 6.3); c.fill();
    }
    c.globalAlpha = 1;
  }
  // Fairy lights strung across the top, switching on bulb by bulb on the beat.
  if (T >= lightsFrom) {
    const k = (T - lightsFrom) / (BEAT / 3);
    c.strokeStyle = 'rgba(80,40,30,.6)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-20, 70);
    c.quadraticCurveTo(270, 170, 540, 80); c.quadraticCurveTo(810, 170, 1100, 70); c.stroke();
    for (const i of bulbs) {
      const x = 30 + i * 85, half = x < 540 ? x / 540 : (x - 540) / 540, y = 70 + Math.sin(half * Math.PI) * 52 + 26;
      const lit = k > i, fl = 0.75 + 0.25 * Math.sin(T * 9 + i * 1.7);
      c.strokeStyle = 'rgba(80,40,30,.6)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y - 26); c.lineTo(x, y - 8); c.stroke();
      if (lit) {
        const g = c.createRadialGradient(x, y, 0, x, y, 46);
        g.addColorStop(0, `rgba(255,236,160,${0.9 * fl})`); g.addColorStop(1, 'rgba(255,220,120,0)');
        c.fillStyle = g; c.beginPath(); c.arc(x, y, 46, 0, 6.3); c.fill();
      }
      c.fillStyle = lit ? `rgba(255,${226 + 20 * fl},${150 + 40 * fl},1)` : 'rgba(150,120,80,.6)';
      c.beginPath(); c.ellipse(x, y, 11, 15, 0, 0, 6.3); c.fill();
    }
  }
}

const FLASH_COL = { card: '255,240,230', seal: '255,226,236', flip: '255,236,240', arch: '255,246,240', push: '255,236,236', heart: '255,214,228', foil: '255,236,190', bloom: '255,226,236' };

function render(T) {
  T = cl(T, 0, TOTAL);
  const beat = T >= BAR ? (T - BAR) % BEAT : 9;
  stage.style.transform = `scale(${1 + 0.01 * Math.exp(-beat * 7)})`;
  Object.values(deco).forEach((e) => { e.style.display = 'none'; });
  SEGS.forEach((s, i) => {
    const u = T - s.start, next = SEGS[i + 1];
    const on = u >= 0 && (u < s.dur + (next ? TR[next.enter].post : 0) || i === SEGS.length - 1);
    const sc = R[s.key].sc;
    sc.style.display = on ? 'block' : 'none';
    if (!on) return;
    sc.style.transform = '';
    R[s.key].f(u, s);
    if (s.enter) transition(sc, s.enter, seg(u, 0, TR[s.enter].post));
  });
  let fa = 0, fc = '255,255,255';
  SEGS.forEach((s) => {
    if (!s.enter) return;
    const u = T - s.start, pk = s.enter === 'bloom' || s.enter === 'card' ? 0.8 : 0.45;
    const v = u < 0 ? (u > -0.08 ? pk * (1 + u / 0.08) : 0) : pk * Math.exp(-u * 7);
    if (v > fa) { fa = v; fc = FLASH_COL[s.enter]; }
  });
  // The seal opening lands on the first strong beat.
  const open = T - 2.5, ov = open >= 0 ? 0.55 * Math.exp(-open * 6) : 0;
  if (ov > fa) { fa = ov; fc = '255,230,190'; }
  const end = seg(T, TOTAL - 0.7, TOTAL);
  flash.style.background = end > 0 ? `rgba(0,0,0,${end})` : `rgba(${fc},${fa})`;
  fx(T);
}

window.__render = render;
window.__firstBar = BAR;
window.__ready = ready(stage, [['48px Brush', 'A'], ['600 48px Play', 'A'], ['48px Corm', 'A'], ['italic 48px Corm', 'A'], ['48px Mukta', 'Aश्री'], ['600 48px Mukta', 'Aश्री'], ['48px Rozha', 'श्री']], TOTAL);
</script></body></html>
