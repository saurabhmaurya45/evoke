items.forEach((e, i) => {

const rip = [0, 1, 2].map(() => mk(s6, 'div', 'width:190px;height:190px;border-radius:50%;border:5px solid #fff'));

// ---- S7 Countdown ----
const s7 = scene(stage);
const s7n = im(s7, src('neb2'), 2720, 2010);
const s7f = im(s7, src('forest'), 1500, 1107);
const s7lines = wrap(D.countdown?.title, 2, 4).map((l) => text(s7, l, `font:500 116px Upright,Gotu;color:#fff;${glow}`, 960));
const tiles = ['DAYS', 'HRS', 'MIN', 'SEC'].map((lab) => {
  const e = mk(s7, 'div', `width:216px;height:236px;border-radius:22px;background:linear-gradient(160deg,rgba(40,16,70,.82),rgba(90,22,92,.78));border:4px solid ${GOLD};box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 26px rgba(255,214,140,.35)`);

});
const rawDate = str(D.countdown?.date);
const when = new Date(/^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? `${rawDate}T00:00:00` : rawDate).getTime();

const FIN = [Math.floor(left / 86400), Math.floor((left % 86400) / 3600), Math.floor((left % 3600) / 60), left % 60];

logo.textContent = 'theinvitely.in';
const under = mk(s8, 'div', `height:5px;background:linear-gradient(90deg,transparent,${GOLD},transparent)`);

// ---- Royal doors ----
function door(k) {
  const mkLeaf = (left, edge) => {
    const d = mk(stage, 'div', '');
    d.className = 'door';
    d.style.left = left;
    d.style.backgroundImage = `url(${src(k)})`;

  return [mkLeaf('0', 'right'), mkLeaf('540px', 'left')];

const dP = door('purple'), dK = door('pink');
function doors(d, t, a, b, c, e) {
  const on = t >= a && t < e;
  d.forEach((x) => { x.style.display = on ? 'block' : 'none'; });
  if (!on) return;
  const open = t < b ? 1 - ioC(seg(t, a, b)) : t < c ? 0 : ioC(seg(t, c, e));
  d[0].style.transform = `translateX(${-540 * open}px)`;
  d[1].style.transform = `translateX(${540 * open}px)`;
}

// ---- Particles, light leak, flash, vignette ----
const leak = mk(stage, 'div', 'width:1500px;height:1500px;border-radius:50%;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,160,70,.75),rgba(255,70,120,.32) 42%,transparent 68%)');
const cv = document.createElement('canvas');
cv.width = 1080; cv.height = 1920;
stage.appendChild(cv);
const c = cv.getContext('2d');
mk(stage, 'div', 'width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(8,0,18,.5) 100%)');
const flash = mk(stage, 'div', 'width:1080px;height:1920px');
const R = rng(7);
const dust = Array.from({ length: 110 }, () => ({ x: R() * 1080, y: R() * 1920, v: 18 + R() * 46, f: 0.4 + R() * 1.2, p: R() * 6.28, r: 1.2 + R() * 3.2 }));
const stars = Array.from({ length: 150 }, () => ({ x: R() * 1080, y: R() * 1200, p: R() * 6.28, f: 1.5 + R() * 4, r: 1 + R() * 2.6 }));
const PET = ['#ff5d8f', '#ff8fb1', '#ffb03b', '#ff7a2f', '#ffd76a', '#e8346f'];
const petals = Array.from({ length: 60 }, () => ({ x: R() * 1080, y: R() * 2200, v: 190 + R() * 220, sw: 30 + R() * 70, f: 0.6 + R() * 1.2, p: R() * 6.28, w: 15 + R() * 17, c: PET[Math.floor(R() * 6)], rs: 1 + R() * 3 }));
const burstAt = (t, y, seed) => { const r = rng(seed); return { t, y, p: Array.from({ length: 70 }, () => ({ a: r() * 6.28, d: 220 + r() * 640, s: 2 + r() * 5, h: r() })) }; };
// Bursts on the main timeline, plus one per event on the real clock.
const BURSTS = [[2.5, 860], [3.75, 800], [7.5, 800], [20, 800], [24.2, 800], [27.5, 760]].map(([t, y], i) => burstAt(t, y, 100 + i));
const EV_BURSTS = items.map((_, i) => burstAt(T0 + i * DUR + 0.3, 800, 200 + i));
const SHOOT = [[3.9, 180, 120], [6.1, 760, 170], [23.3, 120, 180], [25.9, 820, 120]];
const FLASH = [[2.5, '255,236,190', 1], [7.5, '255,226,160', 0.55], [10, '255,244,214', 0.35], [17.5, '255,190,225', 0.75], [20, '255,240,245', 0.45], [22.5, '255,220,240', 0.4], [25, '255,255,255', 0.95], [27.5, '255,226,160', 0.5]];

function drawBurst(b, u) {
  if (u < 0 || u > 1.1) return;
  const e = outE(u / 1.1), a = 1 - u / 1.1;
  for (const p of b.p) {
    c.fillStyle = p.h > 0.5 ? `rgba(255,226,150,${a})` : `rgba(255,250,235,${a})`;
    c.beginPath();
    c.arc(540 + Math.cos(p.a) * p.d * e, b.y + Math.sin(p.a) * p.d * e + u * u * 260, p.s * (1 - u / 2), 0, 6.3);
    c.fill();
  }
}

function fx(T, t) {
  c.clearRect(0, 0, 1080, 1920);
  c.globalCompositeOperation = 'lighter';
  if (inR(t, 0, 7.5) || inR(t, 22.4, 30)) {
    for (const s of stars) {
      const a = 0.2 + 0.8 * Math.pow(0.5 + 0.5 * Math.sin(T * s.f + s.p), 3);
      c.fillStyle = `rgba(255,248,225,${a})`;
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.3); c.fill();
      if (a > 0.8) { c.fillRect(s.x - s.r * 5, s.y - 0.6, s.r * 10, 1.2); c.fillRect(s.x - 0.6, s.y - s.r * 5, 1.2, s.r * 10); }
    }
  }
  for (const d of dust) {
    const y = (d.y - T * d.v + 192000) % 1920, x = d.x + Math.sin(T * d.f + d.p) * 34, a = 0.25 + 0.6 * Math.pow(0.5 + 0.5 * Math.sin(T * d.f * 3 + d.p), 2);
    c.fillStyle = `rgba(255,214,140,${a})`;
    c.beginPath(); c.arc(x, y, d.r, 0, 6.3); c.fill();
  }
  for (const b of BURSTS) drawBurst(b, t - b.t);
  for (const b of EV_BURSTS) drawBurst(b, T - b.t);
  for (const [a, x0, y0] of SHOOT) {
    const u = (t - a) / 0.7;
    if (u < 0 || u > 1) continue;
    const x = x0 + u * 560, y = y0 + u * 300;
    const g = c.createLinearGradient(x - 210, y - 112, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, `rgba(255,245,215,${1 - u})`);
    c.strokeStyle = g; c.lineWidth = 5;
    c.beginPath(); c.moveTo(x - 210, y - 112); c.lineTo(x, y); c.stroke();
  }
  c.globalCompositeOperation = 'source-over';
  const pa = inR(t, 3, 7.5) ? seg(t, 3, 3.6) : inR(t, 17.8, 20) ? seg(t, 17.8, 18.2) : inR(t, 25.6, 30) ? seg(t, 25.6, 26.2) * 0.9 : inR(t, 10, 17.5) ? 0.55 : 0;
  if (pa > 0) {
    c.globalAlpha = pa;
    for (const p of petals) {
      const y = (p.y + T * p.v) % 2200 - 140, x = p.x + Math.sin(T * p.f + p.p) * p.sw, sq = 0.28 + 0.72 * Math.abs(Math.sin(T * p.rs + p.p));
      c.save();
      c.translate(x, y); c.rotate(T * p.rs * 0.6 + p.p); c.scale(1, sq);
      c.fillStyle = p.c;
      c.beginPath(); c.moveTo(-p.w, 0); c.quadraticCurveTo(0, -p.w * 0.95, p.w, 0); c.quadraticCurveTo(0, p.w * 0.95, -p.w, 0); c.fill();
      c.restore();
    }
    c.globalAlpha = 1;
  }
}

function renderEvents(T) {
  const r = outC(seg(T, 9.82, 10.3)) * 1300;
  s4.style.clipPath = T < 10.3 ? `circle(${r}px at 50% 42%)` : '';
  // The background is 3164px tall; loop its drift so a long list of events never runs off it.
  P(s4bg, { y: 1582 - ((T - 10) * 62) % 1244 });
  items.forEach((e, i) => {
    const Ti = T0 + i * DUR, Tn = Ti + DUR, on = T >= Ti - 0.15 && T < Tn + 0.32;
    e.g.style.display = e.n.style.display = e.d.style.display = on ? 'block' : 'none';
    if (!on) return;
    const type = entry(i), start = i === 0 ? Ti - 0.05 : Ti;
    const p = seg(T, start, start + 0.46), q = i < N - 1 ? seg(T, Tn, Tn + 0.3) : 0;
    const o = { x: 540, y: 800 + 8 * Math.sin((T - Ti) * 3.1), s: 1, r: 2 * Math.sin((T - Ti) * 2.51), a: 1, b: 0, ry: 0 };
    if (type === 0 || type === 5) {
      o.y += lerp(-1400, 0, outB(p, 1.25));
      o.r += (1 - p) * (type ? 22 : -14);
      if (type === 5) o.r += 7 * Math.exp(-(T - Ti) * 3) * Math.sin((T - Ti) * 11);
    }
    if (type === 1) { o.s = lerp(0.15, 1, outB(p, 1.6)); o.a = cl(p * 4); }
    if (type === 2) { o.x += (1 - outE(p)) * 1500; o.b = (1 - p) * p * 90; }
    if (type === 3) { o.ry = (1 - outC(p)) * 90; o.a = p > 0 ? 1 : 0; }
    if (type === 4) { o.r += (1 - outB(p, 1.2)) * -280; o.s = outB(p, 1.3); o.a = cl(p * 5); }
    if (q > 0) {
      const qq = inC(q), next = entry(i + 1);
      if (next === 1) { o.s = 1 + qq * 6; o.a = 1 - q; }
      if (next === 2) { o.x -= qq * 1500; o.b = q * (1 - q) * 90; }
      if (next === 3) { o.ry = -qq * 90; o.a = q < 1 ? 1 : 0; }
      if (next === 4) { o.r += qq * 240; o.s = 1 - qq; }
      if (next === 5) { o.y += qq * 2100; o.r += qq * 22; }
    }
    P(e.g, o);
    e.ill.style.transform = `scale(${1.04 + (T - Ti) * 0.07}) translateY(${(Ti + 0.6 - T) * 14}px)`;
    const ta = 1 - seg(T, Tn - 0.03, Tn + 0.14) * (i < N - 1 ? 1 : 0);
    P(e.n, { y: 1402, a: ta }); reveal(e.n, T, Ti + 0.14, 0.028, 0.34, 50);
    P(e.d, { y: 1500, a: ta * seg(T, Ti + 0.34, Ti + 0.56) });
  });
}

// A section with no data is left out. The sections run on a fixed main timeline, each a whole number of
// bars with a flash on its first beat, so any of them can follow any other and stay on the beat.
const hasIntro = !!str(D.family?.invocation).trim();
const hasMeet = !!(str(D.meet?.bride).trim() || str(D.meet?.groom).trim());
const hasRsvp = !!str(D.rsvp?.title).trim();
const hasCountdown = left > 0;
const START = hasIntro ? 0 : 2.5;
const AFTER_EVENTS = [hasMeet && [17.5, 20], hasRsvp && [20, 22.5], hasCountdown && [22.5, 25], [25, 30]].filter(Boolean);
const TOTAL = EV_END + AFTER_EVENTS.reduce((sum, [a, b]) => sum + b - a, 0) - START;

function toMain(T) {
  if (T < EV_END) {
    // The doors into the couple scene close over the end of the last event.
    return hasMeet && T >= EV_END - 0.36 ? 17.5 - (EV_END - T) : Math.min(T, 17.13);
  }
  let rest = T - EV_END;
  for (const [a, b] of AFTER_EVENTS) {
    if (rest < b - a) return a + rest;
    rest -= b - a;
  }
  return 30;
}

function render(filmTime) {
  const T = filmTime + START;
  const t = toMain(T);
  const beat = T >= 2.5 ? (T - 2.5) % 0.625 : 9;
  stage.style.transform = `scale(${1 + 0.012 * Math.exp(-beat * 7)})`;

  if (show(s1, t, 0, hasIntro ? 2.62 : 0)) {
    P(s1n, { y: 960, s: lerp(1.05, 1.22, t / 2.5) }); P(s1dark);
    const z = inC(seg(t, 2.15, 2.55));
