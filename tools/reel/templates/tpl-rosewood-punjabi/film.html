<!doctype html>
<html><head><meta charset="utf-8"><title>Rosewood Film</title>
<style>
@font-face{font-family:Gar;src:url("fonts/eb-garamond-latin.woff2");font-weight:400 800}
@font-face{font-family:Gar;font-style:italic;src:url("fonts/eb-garamond-italic-latin.woff2");font-weight:400 800}
@font-face{font-family:Paris;src:url("fonts/parisienne-latin.woff2")}
@font-face{font-family:Jacq;src:url("fonts/jacques-francois-latin.woff2")}
@font-face{font-family:Mukta;src:url("fonts/mukta-400-latin.woff2");font-weight:400}
@font-face{font-family:Mukta;src:url("fonts/mukta-400-devanagari.woff2");font-weight:400;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Mukta;src:url("fonts/mukta-600-latin.woff2");font-weight:600}
@font-face{font-family:Mukta;src:url("fonts/mukta-600-devanagari.woff2");font-weight:600;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:Rozha;src:url("fonts/rozha-one-latin.woff2")}
@font-face{font-family:Rozha;src:url("fonts/rozha-one-devanagari.woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px}

.sc{position:absolute;inset:0;overflow:hidden;display:none}

</style></head><body><div id="stage"></div>
<script src="../../lib/core.js"></script>
<script>
const D = window.__DATA;
const stage = document.querySelector('#stage');
const BEAT = 0.625, BAR = 2.5;

// ---- The template's palette and type: pink marble paper, royal blue type, terracotta ----
const BLUE = '#15528a', DBLUE = '#0d3966', TERRA = '#ad6339', HEART = '#b84a33', CREAM = '#fff6e9', GOLD = '#c9a24a', LGOLD = '#f1d98f';
const SERIF = 'Gar,Mukta', SCRIPT = 'Paris,Gar,Mukta', DEV = 'Rozha,Mukta';
const ART = 'https://pub-da9e4ff58a2b4062a77df0109c7d7c6f.r2.dev/asset/invitation-templates/template%204/static/images/';
const IMG = {
  mandap: `${ART}fr/qVsgM18CFG4GeE1VqPWGaJWXn1E.png`,
  paper: `${ART}fr/tQamYVF9dNikv55vOdTj0ejrfH8.png`,
  cherry: `${ART}fr/Nry9qTqzhhs6ZnmJO2zAVuzk0A.png`,
  petals: `${ART}fr/i1i836eEghd1vwapuBYoKoalBc.png`,
  door: `${ART}fr/bOW1f3pjThAQpndqrhEN5obZKg.png`,
  roses: `${ART}fr/eJ9mG3rO9YZAeikJPvJ0e4G2rDE.png`,
};
// The template's illustration for each of its six event cards, in card order.
const EVENT_ART = ['haldi', 'cocktail', 'engagement', 'anand-karaj', 'reception', 'mehendi'].map((k) => `${ART}event-${k}.webp`);

// ---- Data, used exactly as saved. A section with nothing in it is left out. ----
const val = (v) => str(v).trim().replace(/[ \t]+/g, ' ');
const list = (v) => (Array.isArray(v) ? v : []);
// A paragraph in even lines, so no word is left alone on the last one.
function lines(value, max, count) {
  const out = [];
  for (const w of str(value).trim().split(/\s+/).filter(Boolean)) {
    const last = out[out.length - 1];
    if (last !== undefined && (last + ' ' + w).length <= max) out[out.length - 1] = `${last} ${w}`;
    else out.push(w);
  }
  if (out.length > count) { out.length = count; out[count - 1] = out[count - 1].replace(/[,.;:!?]*$/, '') + '…'; }
  return out;
}
function para(value, max, count) {
  const s = str(value).trim();
  const n = Math.ceil(s.length / max);
  return n > count ? lines(s, max, count) : wrap(s, Math.max(1, n), 1);
}
// Text the user wrote on several lines keeps its line breaks; long lines are wrapped.
function mlines(value, max, count) {
  const out = str(value).split(/\n/).map((l) => l.trim()).filter(Boolean).flatMap((l) => para(l, max, count));
  if (out.length > count) { out.length = count; out[count - 1] = out[count - 1].replace(/[,.;:!?]*$/, '') + '…'; }
  return out;
}
const groom = val(D?.couple?.groomName), bride = val(D?.couple?.brideName);
const initial = (s) => (graphemes(s)[0] || '').toUpperCase();
const blessings = mlines(D?.family?.blessings, 34, 5), family = val(D?.family?.name);
const invites = val(D?.invite?.invites), line1 = val(D?.invite?.line1), line2 = val(D?.invite?.line2);
const gPar = mlines(D?.family?.groomParents, 34, 2), bPar = mlines(D?.family?.brideParents, 34, 2);
const events = list(D?.events?.items).map((it, i) => ({
  name: val(it?.name), sched: mlines(it?.schedule, 32, 3), photo: safeImage(it?.photo), art: EVENT_ART[i % 6],
})).filter((e) => e.name).slice(0, 6);
const photos = ['photo1', 'photo2', 'photo3', 'photo4', 'photo5', 'photo6'].map((k) => safeImage(D?.gallery?.[k])).filter(Boolean).slice(0, 5);
const feature = safeImage(D?.gallery?.photo7);
const introSmall = val(D?.intro?.small), introHead = val(D?.intro?.heading);
const jTitle = val(D?.journey?.title), jSub = para(val(D?.journey?.subtitle), 34, 3).filter(Boolean);
const tTitle = mlines(D?.thanks?.title, 20, 3);
const tBody = mlines(D?.thanks?.body, 34, 6);

// ---- The cut list: whole bars, so any section may follow any and stay on the beat. ----
const SEGS = [];
const add = (key, dur, enter) => SEGS.push({ key, dur, enter });
add('mantra', BAR, null);
add('mandap', 2 * BAR, 'drapes');
if (blessings.length || family) add('bless', BAR, 'aisle');
if (line1 || gPar.length || bPar.length) add('invites', 2 * BAR, 'heart');
if (events.length) add('events', Math.ceil(events.length / 2) * BAR, 'oval');
if (photos.length) add('couple', BAR, 'polaroid');
if (jTitle || jSub.length) add('journey', BAR, 'door');
if (tTitle.length || tBody.length) add('thanks', tBody.length > 3 ? 2 * BAR : BAR, 'blossom');
add('end', 6 * BEAT, 'bloom');
let acc = 0;
SEGS.forEach((s) => { s.start = acc; acc += s.dur; });
const TOTAL = acc;
const TR = { drapes: 0.7, aisle: 0.55, heart: 0.6, oval: 0.6, polaroid: 0.65, door: 0.6, blossom: 0.6, bloom: 0.35 };

// ---- Helpers ----
const R = {};
function paper(sc) {
  return mk(sc, 'div', `width:1080px;height:1920px;background:#f6b9c4 url("${IMG.paper}") 0 0/1080px auto repeat-y`);
}
const PHOTO_FALLBACK = (() => {
  const c = document.createElement('canvas'); c.width = 96; c.height = 128;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 96, 128);
  g.addColorStop(0, '#fbd3db'); g.addColorStop(1, '#d97f93');
  x.fillStyle = g; x.fillRect(0, 0, 96, 128);
  return c.toDataURL('image/png');
})();
const photo = (parent, url, w, h, extra = '') => im(parent, url, w, h, `object-fit:cover;${extra}`, PHOTO_FALLBACK);
// The heart monogram from the template, with the couple's initials.
function monogram(parent, size) {
  const w = mk(parent, 'div', `width:${size}px;height:${size * 0.92}px`);
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 32 30'); s.setAttribute('width', size); s.setAttribute('height', size * 0.92);
  // Each heart has its own gradient id: a shared one would point into a hidden scene and draw nothing.
  const id = `hg${++monogram.n}`;
  s.innerHTML = `<defs><radialGradient id="${id}" cx="50%" cy="32%" r="75%"><stop offset="0%" stop-color="#d0664c"/><stop offset="100%" stop-color="#a5402c"/></radialGradient></defs><path fill="url(#${id})" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>`;
  s.style.cssText = 'position:absolute;left:0;top:0;filter:drop-shadow(0 0 30px rgba(255,170,150,.8))';
  w.appendChild(s);
  [[initial(groom), 0.39], [initial(bride), 0.61]].forEach(([ch, fx]) => {
    const l = mk(w, 'div', `left:${size * fx - size * 0.2}px;width:${size * 0.4}px;top:${size * 0.2}px;text-align:center;font:600 ${size * 0.26}px/1 ${SERIF};color:${CREAM}`);
    l.textContent = ch;
  });
  return w;
}
monogram.n = 0;
const fade = (u, a, d = 0.5) => outC(seg(u, a, a + d));
const rise = (el, u, at, y, x = 540, d = 0.55) => { const p = fade(u, at, d); P(el, { x, y: y + (1 - p) * 30, a: p, b: (1 - p) * 6 }); };

// ================= Scenes (in cut order, so a later scene draws over an earlier one) =================

// ---- The Mangala mantra, with the heart monogram; the drapes close on the last beat ----
const drape = (parent) => {
  const make = (side) => mk(parent, 'div', `width:600px;height:1920px;background:repeating-linear-gradient(90deg,#f7c3cd 0 40px,#efa6b5 70px,#f7c3cd 100px);box-shadow:${side ? '-' : ''}20px 0 40px rgba(150,40,70,.25)`);
  return [make(0), make(1)];
};
{
  const sc = scene(stage);
  paper(sc);
  const heart = monogram(sc, 300);
  const m1 = text(sc, 'ॐ मंगलं भगवान् विष्णुः', `font:400 80px ${DEV};color:${TERRA}`, 960);
  const m2 = text(sc, 'मंगलं गरुडध्वजः', `font:400 80px ${DEV};color:${TERRA}`, 960);
  const t1 = text(sc, 'Om Mangalam Bhagavan Vishnuh,', `font:italic 500 48px ${SERIF};color:${TERRA}`, 960);
  const t2 = text(sc, 'Mangalam Garudadhwajah', `font:italic 500 48px ${SERIF};color:${TERRA}`, 960);
  const orn = text(sc, '❦', `font:400 56px ${SERIF};color:${TERRA}`);
  const [dl, dr] = drape(sc);
  R.mantra = { sc, f(u) {
    const b = u % BEAT;
    P(heart, { y: 560, s: outB(seg(u, 0, 0.5), 1.6) * (1 + 0.06 * Math.exp(-b * 8)), a: cl(seg(u, 0, 0.2) * 3) });
    [[m1, 0.25, 860], [m2, 0.6, 970]].forEach(([e, at, y]) => {
      const p = seg(u, at, at + 0.55);
      P(e, { y, a: cl(p * 3) });
      e.style.clipPath = `inset(-40% ${(1 - ioC(p)) * 100}% -40% -5%)`;
    });
    rise(t1, u, 0.95, 1085); rise(t2, u, 1.1, 1145);
    P(orn, { y: 1240, s: Math.max(0.001, outB(seg(u, 1.3, 1.65), 2)) });
    // The drapes draw closed on the last beat, ready to part on the first strong one.
    const c = ioC(seg(u, 3 * BEAT, BAR));
    P(dl, { x: -300 + c * 600, y: 960 }); P(dr, { x: 1380 - c * 600, y: 960 });
  } };
}

// ---- The mandap: the camera pulls back from the chandelier, then glides down the aisle ----
const DRAPE = {};
{
  const sc = scene(stage);
  paper(sc);
  const cam = mk(sc, 'div', 'width:1080px;height:1920px;transform-origin:540px 520px');
  // Wider than the screen, so the mandap and its lawn fill the frame top to bottom.
  const W = 1420, H = W * 7456 / 1572;
  const bg = im(cam, IMG.mandap, W, H, 'left:-170px;top:0');
  const glow = mk(sc, 'div', 'width:900px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,230,.75),transparent 65%)');
  const shadow = 'text-shadow:0 0 22px rgba(255,248,240,.95),0 2px 8px rgba(255,255,255,.8);';
  const nG = text(sc, groom, `font:400 150px ${SCRIPT};color:${TERRA};${shadow}`, 860);
  const weds = text(sc, 'WEDS', `font:600 50px ${SERIF};letter-spacing:12px;color:${TERRA};${shadow}`);
  const nB = text(sc, bride, `font:400 150px ${SCRIPT};color:${TERRA};${shadow}`, 860);
  const sparks = Array.from({ length: 16 }, (_, i) => mk(sc, 'div', `width:16px;height:16px;background:#fff8dc;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 6px #ffe9a8)`));
  [DRAPE.l, DRAPE.r] = drape(stage);
  R.mandap = { sc, f(u, s) {
    // Pull back from the chandelier over the first bar, then ease down towards the aisle.
    const back = ioC(seg(u, 0, BAR * 1.1)), down = ioC(seg(u, BAR, s.dur + 0.55));
    cam.style.transform = `translateY(${-down * 620}px) scale(${lerp(1.55, 1, back)})`;
    P(glow, { y: 450 - down * 620, a: 0.85 * (1 - down) });
    const wr = (el, at, y) => {
      const p = seg(u, at, at + 0.7);
      P(el, { y: y - down * 620, a: cl(p * 3) * (1 - seg(down, 0.6, 1)) });
      el.style.clipPath = `inset(-40% ${(1 - ioC(p)) * 100}% -40% -8%)`;
    };
    wr(nG, BEAT, 330);
    P(weds, { y: 450 - down * 620, a: cl(seg(u, 2 * BEAT, 2 * BEAT + 0.3)) * (1 - seg(down, 0.6, 1)), s: lerp(1.3, 1, outC(seg(u, 2 * BEAT, 2 * BEAT + 0.4))) });
    wr(nB, 3 * BEAT, 570);
    // The chandelier twinkles.
    sparks.forEach((e, i) => {
      const a = (i / sparks.length) * 6.283, r = 70 + (i % 3) * 45, tw = Math.sin(u * 6 + i * 2.1);
      P(e, { x: 540 + Math.cos(a) * r * 1.6, y: 150 + Math.sin(a) * r * 0.5 - down * 620, s: 0.5 + Math.max(0, tw) * 1.2, a: Math.max(0, tw) * (1 - back * 0.3) * (1 - down) });
    });
  } };
}

// ---- Blessings and the hosting family ----
const HEART_AT = { x: 540, y: 520 };
{
  const sc = scene(stage);
  paper(sc);
  const heart = monogram(sc, 260);
  const bl = blessings.map((l) => text(sc, l, `font:500 50px ${SERIF};color:${BLUE}`, 960));
  const fam = family ? text(sc, family, `font:500 70px ${SERIF};color:${BLUE}`, 960) : null;
  const rule = mk(sc, 'div', `width:300px;height:5px;background:${BLUE}`);
  const burst = Array.from({ length: 14 }, (_, i) => mk(sc, 'div', `width:30px;height:22px;border-radius:50% 50% 50% 0;background:${['#d2384f', '#e8697c', '#f29aa8'][i % 3]}`));
  const top = 760, lh = 66;
  R.bless = { sc, f(u) {
    P(heart, { x: HEART_AT.x, y: HEART_AT.y, s: outB(seg(u, 0.1, 0.55), 1.8) * (1 + 0.05 * Math.exp(-((u % BEAT)) * 8)) });
    const b = seg(u, 0.25, 1.3);
    burst.forEach((e, i) => {
      const a = (i / burst.length) * 6.283 + 0.3, d = outC(b) * (260 + (i % 4) * 60);
      P(e, { x: HEART_AT.x + Math.cos(a) * d, y: HEART_AT.y + Math.sin(a) * d + b * b * 120, r: b * 300 + i * 40, a: b > 0 && b < 1 ? 1 - b : 0 });
    });
    bl.forEach((e, i) => rise(e, u, 0.5 + i * 0.14, top + i * lh));
    const fy = top + bl.length * lh + (bl.length ? 70 : 0);
    if (fam) rise(fam, u, 0.6 + bl.length * 0.14, fy);
    const rp = outC(seg(u, 0.9 + bl.length * 0.14, 1.4 + bl.length * 0.14));
    P(rule, { y: fy + (fam ? 90 : 0), a: rp }); rule.style.transform += ` scaleX(${rp})`;
  } };
}

// ---- Invites: the couple and their parents ----
{
  const sc = scene(stage);
  paper(sc);
  const rows = [];
  const row = (el, gap, kind) => { if (el) rows.push({ el, gap, kind }); };
  row(invites ? text(sc, invites, `font:500 128px ${SERIF};letter-spacing:6px;color:${BLUE}`, 960) : null, 0, 'big');
  row(line1 ? text(sc, line1, `font:500 46px ${SERIF};color:${BLUE}`, 960) : null, 110, 'small');
  row(text(sc, groom, `font:500 120px ${SERIF};letter-spacing:4px;color:${BLUE};text-transform:uppercase`, 960), 150, 'name');
  gPar.forEach((l, i) => row(text(sc, l, `font:500 44px ${SERIF};color:${BLUE}`, 960), i ? 58 : 100, 'small'));
  row(text(sc, '&', `font:400 130px ${SCRIPT};color:${TERRA}`), 130, 'amp');
  row(text(sc, bride, `font:500 120px ${SERIF};letter-spacing:4px;color:${BLUE};text-transform:uppercase`, 960), 125, 'name');
  bPar.forEach((l, i) => row(text(sc, l, `font:500 44px ${SERIF};color:${BLUE}`, 960), i ? 58 : 100, 'small'));
  let y = 0;
  rows.forEach((r, i) => { y += i ? r.gap : 0; r.y = y; });
  const top = 880 - y / 2;
  R.invites = { sc, f(u) {
    // Each line on its own half beat; the names land on the beat.
    rows.forEach((r, i) => {
      const at = 0.3 + i * (BEAT / 2), yy = top + r.y;
      if (r.kind === 'name') reveal(r.el, u, at, 0.04, 0.5, 60), P(r.el, { y: yy });
      else if (r.kind === 'amp') P(r.el, { y: yy, s: Math.max(0.001, outB(seg(u, at, at + 0.45), 2)), r: (1 - seg(u, at, at + 0.45)) * -40 });
      else if (r.kind === 'big') { P(r.el, { y: yy, s: lerp(1.25, 1, outC(seg(u, at, at + 0.6))), a: cl(seg(u, at, at + 0.3)), b: (1 - seg(u, at, at + 0.5)) * 10 }); r.el.style.letterSpacing = `${lerp(30, 6, outC(seg(u, at, at + 0.7)))}px`; }
      else rise(r.el, u, at, yy);
    });
  } };
}

// ---- Events: each in its gold oval, one every two beats ----
{
  const sc = scene(stage);
  paper(sc);
  const head = line2 ? text(sc, line2, `font:italic 500 56px ${SERIF};color:${BLUE}`, 940) : null;
  const OW = 560, OH = OW * 974 / 724;
  const cards = events.map((ev) => {
    const g = mk(sc, 'div', `width:${OW}px;height:${OH}px`);
    if (ev.photo) {
      // A user photo goes in a gold oval, like the template's frames.
      const ring = mk(g, 'div', `left:28px;top:30px;width:${OW - 56}px;height:${OH - 60}px;border-radius:50%;background:linear-gradient(140deg,#fff0b5,${GOLD} 35%,#8a6a1c 60%,${LGOLD});box-shadow:0 20px 50px rgba(120,40,60,.35)`);
      const hole = mk(ring, 'div', `left:18px;top:18px;width:${OW - 92}px;height:${OH - 96}px;border-radius:50%;overflow:hidden`);
      g.img = photo(hole, ev.photo, OW - 92, OH - 96);
    } else {
      g.img = im(g, ev.art, OW, OH, '', PHOTO_FALLBACK);
    }
    g.name = text(sc, ev.name, `font:500 92px ${SERIF};color:${BLUE}`, 940);
    g.sched = ev.sched.map((l) => text(sc, l, `font:500 48px ${SERIF};color:${BLUE}`, 940));
    return g;
  });
  R.events = { sc, f(u, s) {
    if (head) { rise(head, u, 0.15, 300); head.style.opacity = String(Number(head.style.opacity) * (1 - seg(u, s.dur - 0.6, s.dur))); }
    const step = 2 * BEAT, n = cards.length;
    cards.forEach((g, i) => {
      // The card leaves just before the next one glides in, so the two never pile up.
      const t0 = i * step, inP = seg(u, t0 + (i ? 0.12 : 0.05), t0 + 0.65), outP = i < n - 1 ? seg(u, t0 + step - 0.08, t0 + step + 0.3) : 0;
      const on = u >= t0 && outP < 1;
      g.style.display = on ? 'block' : 'none';
      g.name.style.display = g.style.display;
      g.sched.forEach((e) => { e.style.display = g.style.display; });
      if (!on) return;
      const e = outB(inP, 1.2), o = inC(outP);
      P(g, { x: 540 + (1 - e) * 900 - o * 1000, y: 820 + Math.sin(u * 2 + i) * 6, r: (1 - inP) * 12 - o * 12, ry: (1 - inP) * -30 + o * 30, a: cl(inP * 3) });
      g.img.style.transform = `scale(${1.04 - seg(u, t0, t0 + step) * 0.04})`;
      const ta = cl(seg(u, t0 + 0.3, t0 + 0.6)) * (1 - outP * 2);
      P(g.name, { y: 1290 + (1 - fade(u, t0 + 0.3)) * 30, a: ta });
      g.sched.forEach((e, j) => P(e, { y: 1385 + j * 62, a: cl(seg(u, t0 + 0.4 + j * 0.08, t0 + 0.7 + j * 0.08)) * (1 - outP * 2) }));
    });
  } };
}

// ---- Introducing the couple: torn-edge photos land in a collage ----
{
  const sc = scene(stage);
  paper(sc);
  const small = introSmall ? text(sc, introSmall, `font:500 44px ${SERIF};letter-spacing:8px;color:${BLUE}`, 900) : null;
  const head = introHead ? text(sc, introHead, `font:400 130px ${SCRIPT};color:${BLUE}`, 940) : null;
  const n = photos.length;
  // Collage spots, in the template's loose arrangement.
  const SPOTS = {
    1: [[540, 930, 640, 820, -3]],
    2: [[380, 860, 480, 620, -6], [700, 1080, 480, 620, 5]],
    3: [[330, 820, 420, 540, -6], [740, 860, 420, 540, 5], [540, 1200, 460, 400, -2]],
    4: [[320, 800, 400, 500, -6], [760, 780, 400, 500, 6], [330, 1240, 400, 400, 4], [750, 1220, 420, 500, -5]],
    5: [[300, 790, 380, 470, -7], [780, 760, 380, 470, 6], [540, 1010, 420, 520, -1], [300, 1260, 380, 380, 5], [780, 1250, 380, 380, -6]],
  }[n] || [];
  const rough = (w, h, seed) => {
    const r = rng(seed), pts = [];
    const edge = (ax, ay, bx, by, k) => { for (let i = 0; i < k; i++) { const t = i / k; pts.push(`${(lerp(ax, bx, t) + (r() - 0.5) * 6).toFixed(1)}px ${(lerp(ay, by, t) + (r() - 0.5) * 6).toFixed(1)}px`); } };
    edge(3, 3, w - 3, 3, 14); edge(w - 3, 3, w - 3, h - 3, 18); edge(w - 3, h - 3, 3, h - 3, 14); edge(3, h - 3, 3, 3, 18);
    return `polygon(${pts.join(',')})`;
  };
  const cards = photos.map((url, i) => {
    const [, , w, h] = SPOTS[i];
    const c = mk(sc, 'div', `width:${w}px;height:${h}px;background:#fffdf8;clip-path:${rough(w, h, i + 3)};filter:drop-shadow(0 16px 26px rgba(120,40,60,.35))`);
    photo(c, url, w - 36, h - 36, 'left:18px;top:18px');
    return c;
  });
  R.couple = { sc, f(u) {
    if (small) rise(small, u, 0.1, 300);
    if (head) { P(head, { y: 420, a: cl(seg(u, 0.25, 0.45)) }); head.style.clipPath = `inset(-40% ${(1 - ioC(seg(u, 0.25, 0.95))) * 100}% -40% -8%)`; }
    cards.forEach((c, i) => {
      const [x, y, , , r] = SPOTS[i], at = 0.35 + i * (BEAT / 2), p = seg(u, at, at + 0.5);
      const from = i % 2 ? 1 : -1;
      P(c, { x: x + from * (1 - outC(p)) * 900, y: y - (1 - outC(p)) * 300, r: r + from * (1 - outB(p, 1.6)) * 30, s: lerp(1.25, 1, outC(p)) * (1 + 0.04 * Math.exp(-Math.max(0, u - at - 0.5) * 8) * (p >= 1 ? 1 : 0)), a: cl(p * 4) });
    });
  } };
}

// ---- The journey: into the sunset doorway, or the couple's own feature photo ----
{
  const sc = scene(stage);
  paper(sc);
  const box = mk(sc, 'div', 'width:1080px;height:1160px;overflow:hidden;background:#6a1734');
  // The doorway art is cropped from just above the sun (37%) to below the couple's feet (90%).
  const DH = 1160 / 0.53, DW = DH * 1148 / 2668;
  const img = feature ? photo(box, feature, 1080, 1160) : im(box, IMG.door, DW, DH, `left:${(1080 - DW) / 2}px;transform-origin:50% 75%`);
  mk(sc, 'div', `left:0;top:1090px;width:1080px;height:90px;background:linear-gradient(180deg,transparent,rgba(246,185,196,.95))`);
  const title = jTitle ? text(sc, jTitle, `font:400 110px ${SCRIPT};color:${BLUE}`, 960) : null;
  const sub = jSub.map((l) => text(sc, l, `font:500 46px ${SERIF};color:${BLUE}`, 960));
  R.journey = { sc, f(u) {
    // The camera walks towards the sunset.
    const k = seg(u, 0, BAR + 0.6);
    if (feature) img.style.transform = `scale(${1.12 - k * 0.1})`;
    else img.style.transform = `translateY(${-0.37 * DH}px) scale(${1 + k * 0.14})`;
    if (title) { P(title, { y: 1250, a: cl(seg(u, 0.4, 0.6)) }); title.style.clipPath = `inset(-40% ${(1 - ioC(seg(u, 0.4, 1.1))) * 100}% -40% -8%)`; }
    sub.forEach((e, i) => rise(e, u, 0.8 + i * 0.15, 1360 + i * 58));
  } };
}

// ---- With love: the cherry blossom tree and the rose bouquet ----
{
  const sc = scene(stage);
  paper(sc);
  // The tree and the couple on their bench sit at the bottom of the frame.
  const TH = 1080 * 4479 / 1572;
  const tree = im(sc, IMG.cherry, 1080, TH, `transform-origin:30% 100%`);
  const roses = im(sc, IMG.roses, 360, 360 * 1756 / 1308, 'transform-origin:50% 80%');
  const tl = tTitle.map((l) => text(sc, l, `font:400 ${tTitle.length > 2 ? 96 : 116}px ${SCRIPT};color:${BLUE}`, 820));
  const bl = tBody.map((l) => text(sc, l, `font:500 44px ${SERIF};color:${BLUE}`, 900));
  R.thanks = { sc, f(u, s) {
    tree.style.transform = `translate(0,${1920 - TH + (1 - fade(u, 0, 0.9)) * 300}px) rotate(${Math.sin(u * 1.3) * 0.5}deg)`;
    const rp = outB(seg(u, 0.35, 0.95), 1.3);
    roses.style.transform = `translate(${760 + (1 - rp) * 500}px,${250 - (1 - rp) * 300}px) rotate(${-18 + (1 - rp) * 70 + Math.sin(u * 1.5) * 2}deg)`;
    roses.style.opacity = cl(rp * 3);
    const lh = tTitle.length > 2 ? 100 : 118;
    tl.forEach((e, i) => { P(e, { x: 460, y: 330 + i * lh, a: cl(seg(u, 0.2 + i * 0.25, 0.4 + i * 0.25)) }); e.style.clipPath = `inset(-40% ${(1 - ioC(seg(u, 0.2 + i * 0.25, 0.9 + i * 0.25))) * 100}% -40% -8%)`; });
    const by = 330 + tl.length * lh + 30, per = Math.min(0.3, (s.dur - 1.4) / Math.max(1, bl.length));
    bl.forEach((e, i) => rise(e, u, 0.7 + i * per, by + i * 60));
  } };
}

// ---- End card ----
{
  const sc = scene(stage);
  mk(sc, 'div', `width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 40%,#1d5f9c 0%,${BLUE} 40%,#0a2c52 100%)`);
  const halo = mk(sc, 'div', 'width:1100px;height:520px;border-radius:50%;background:radial-gradient(ellipse,rgba(246,185,196,.38),transparent 68%)');
  // The brand logo, and nothing else.
  const logo = im(sc, '../../lib/watermark-logo.png', 820, 820 * 227 / 640);
  R.end = { sc, f(u) {
    const l = outB(seg(u, 0.15, 0.75), 1.9);
    P(halo, { y: 960, s: l * (1 + 0.05 * Math.sin(u * 5)), a: cl(l) * 0.9 });
    P(logo, { y: 960, s: Math.max(l, 0.001), a: cl(l * 2) });
    logo.style.filter = 'drop-shadow(0 4px 14px rgba(0,0,0,.45))';
  } };
}

// ================= Transitions, each taken from the design =================
const deco = {
  edge: mk(stage, 'div', 'width:1080px;height:70px;background:linear-gradient(180deg,rgba(150,40,70,.28),transparent)'),
  heart: (() => { const e = mk(stage, 'canvas', ''); e.width = 1080; e.height = 1920; return e; })(),
  oval: mk(stage, 'div', `border-radius:50%;border:16px solid ${GOLD};box-shadow:0 0 0 4px ${LGOLD},inset 0 0 0 4px #8a6a1c,0 0 40px rgba(201,162,74,.7)`),
  door: mk(stage, 'div', 'box-sizing:border-box;border:40px solid #7a1838;box-shadow:inset 0 0 0 6px #b23a5a,0 0 50px rgba(90,10,40,.5)'),
  blossom: (() => { const e = mk(stage, 'canvas', ''); e.width = 1080; e.height = 1920; return e; })(),
};
Object.values(deco).forEach((e) => { e.style.display = 'none'; });
const heartPoints = (k, cx, cy) => {
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * Math.PI * 2;
    const x = 16 * Math.sin(t) ** 3, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push([cx + x * k * 3.1, cy + y * k * 3.1]);
  }
  return pts;
};
const BL = rng(91);
const blooms = Array.from({ length: 70 }, () => ({ k: BL(), o: (BL() - 0.5) * 360 * BL(), r: 18 + BL() * 26, a: BL() * 6.28, c: ['#f7a8c0', '#f390ad', '#fbc7d6', '#e46f93'][Math.floor(BL() * 4)] }));
function flower(g, x, y, r, a, col) {
  g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = col;
  for (let i = 0; i < 5; i++) { g.rotate(1.2566); g.beginPath(); g.ellipse(0, -r * 0.55, r * 0.38, r * 0.55, 0, 0, 6.3); g.fill(); }
  g.fillStyle = '#fff1a8'; g.beginPath(); g.arc(0, 0, r * 0.18, 0, 6.3); g.fill(); g.restore();
}
function transition(el, type, p) {
  el.style.clipPath = ''; el.style.opacity = ''; el.style.filter = ''; el.style.outline = '';
  const show = (d) => { d.style.display = 'block'; return d; };
  if (type === 'drapes' && p < 1) {
    // The mandap's drapes, closed at the cut, part from the middle.
    const o = ioC(p);
    show(DRAPE.l); show(DRAPE.r);
    P(DRAPE.l, { x: 300 - o * 620, y: 960 }); P(DRAPE.r, { x: 780 + o * 620, y: 960 });
  }
  if (!(p > 0 && p < 1)) return;
  const e = outC(p);
  if (type === 'aisle') {
    // The camera carries on down the aisle into the next page.
    el.style.transform = `translateY(${(1 - e) * 1920}px)`;
    show(deco.edge); P(deco.edge, { y: (1 - e) * 1920 - 35 });
  }
  if (type === 'heart') {
    const k = lerp(0.05, 9, inC(p) * 0.4 + e * 0.6), pts = heartPoints(k, HEART_AT.x, HEART_AT.y + 40);
    el.style.clipPath = `polygon(${pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')})`;
    const h = show(deco.heart), g = h.getContext('2d');
    g.clearRect(0, 0, 1080, 1920);
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.strokeStyle = HEART; g.lineWidth = 12; g.shadowColor = '#ffb3a0'; g.shadowBlur = 40; g.globalAlpha = 1 - p * 0.4; g.stroke();
    g.globalAlpha = 1; g.shadowBlur = 0;
  }
  if (type === 'oval') {
    // The events open through a gold oval, like their frames.
    const w = lerp(120, 2000, e), h = w * 1.35;
    el.style.clipPath = `ellipse(${w / 2}px ${h / 2}px at 540px 900px)`;
    const o = show(deco.oval);
    o.style.width = `${w + 30}px`; o.style.height = `${h + 30}px`;
    P(o, { y: 900, a: 1 - seg(p, 0.6, 1) });
  }
  if (type === 'polaroid') {
    // The page arrives as a tilted photo with a white border, and grows to fill the screen.
    el.style.transform = `scale(${lerp(0.3, 1, e)}) rotate(${(1 - e) * -12}deg)`;
    el.style.outline = `${(1 - e) * 60}px solid #fffdf8`;
    el.style.filter = `drop-shadow(0 40px 60px rgba(120,40,60,${0.5 * (1 - p)}))`;
  }
  if (type === 'door') {
    const w = lerp(240, 1200, e), h = lerp(420, 2100, e), cy = 960;
    el.style.clipPath = `inset(${cy - h / 2}px ${(1080 - w) / 2}px ${1920 - cy - h / 2}px ${(1080 - w) / 2}px)`;
    const d = show(deco.door);
    d.style.width = `${w + 80}px`; d.style.height = `${h + 80}px`;
    P(d, { y: cy, a: 1 - seg(p, 0.7, 1) });
  }
  if (type === 'blossom') {
    // A drift of cherry blossom sweeps across and leaves the page behind it.
    const x = lerp(-700, 2100, e);
    el.style.clipPath = `polygon(0 0,${x}px 0,${x - 900}px 1920px,0 1920px)`;
    const c = show(deco.blossom), g = c.getContext('2d');
    g.clearRect(0, 0, 1080, 1920);
    for (const b of blooms) flower(g, x - 900 * b.k + b.o, b.k * 1920, b.r, b.a + p * 5, b.c);
  }
  if (type === 'bloom') el.style.opacity = cl(p * 1.6);
}

// ================= The template's falling petals; gold dust on the end card =================
const petalLayers = [0.75, 1.1].map((s) => im(stage, IMG.petals, 1080 * s, 1080 * s * 2237 / 1572, 'opacity:.9'));
const cv = document.createElement('canvas');
cv.width = 1080; cv.height = 1920;
stage.appendChild(cv);
const c = cv.getContext('2d');
mk(stage, 'div', 'width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 46%,transparent 62%,rgba(90,20,50,.25) 100%)');
const flash = mk(stage, 'div', 'width:1080px;height:1920px');
const RN = rng(57);
const dust = Array.from({ length: 70 }, () => ({ x: RN() * 1080, y: RN() * 1920, v: 20 + RN() * 50, r: 1 + RN() * 2.6, p: RN() * 6.28, f: 1 + RN() * 3 }));

function fx(T) {
  c.clearRect(0, 0, 1080, 1920);
  const now = SEGS.find((s) => T >= s.start && T < s.start + s.dur) || SEGS[SEGS.length - 1];
  const onEnd = now.key === 'end';
  petalLayers.forEach((l, i) => {
    const h = parseFloat(l.style.height), v = [70, 120][i], y = ((T * v) % h) - h + 1920 * (i ? 0.1 : 0.4);
    l.style.display = onEnd ? 'none' : 'block';
    l.style.transform = `translate(${i ? -60 : 40}px,${y}px)`;
  });
  if (onEnd) {
    for (const d of dust) {
      const y = (d.y - T * d.v + 1920 * 4) % 1920, tw = 0.4 + 0.6 * Math.abs(Math.sin(T * d.f + d.p));
      c.fillStyle = `rgba(241,217,143,${0.7 * tw})`;
      c.beginPath(); c.arc(d.x + Math.sin(T + d.p) * 10, y, d.r, 0, 6.3); c.fill();
    }
  }
}

const FLASH_COL = { drapes: '255,236,240', aisle: '255,236,240', heart: '255,222,214', oval: '255,240,200', polaroid: '255,250,245', door: '255,226,236', blossom: '255,226,236', bloom: '255,236,240' };

function render(T) {
  T = cl(T, 0, TOTAL);
  const beat = T >= BAR ? (T - BAR) % BEAT : 9;
  stage.style.transform = `scale(${1 + 0.01 * Math.exp(-beat * 7)})`;
  Object.values(deco).forEach((e) => { e.style.display = 'none'; });
  DRAPE.l.style.display = DRAPE.r.style.display = 'none';
  SEGS.forEach((s, i) => {
    const u = T - s.start, next = SEGS[i + 1];
    const on = u >= 0 && (u < s.dur + (next ? TR[next.enter] : 0) || i === SEGS.length - 1);
    const sc = R[s.key].sc;
    sc.style.display = on ? 'block' : 'none';
    if (!on) return;
    sc.style.transform = '';
    R[s.key].f(u, s);
    if (s.enter) transition(sc, s.enter, seg(u, 0, TR[s.enter]));
  });
  let fa = 0, fc = '255,255,255';
  SEGS.forEach((s) => {
    if (!s.enter) return;
    const u = T - s.start, pk = s.enter === 'drapes' || s.enter === 'bloom' ? 0.6 : 0.4;
    const v = u < 0 ? (u > -0.08 ? pk * (1 + u / 0.08) : 0) : pk * Math.exp(-u * 7);
    if (v > fa) { fa = v; fc = FLASH_COL[s.enter]; }
  });
  const end = seg(T, TOTAL - 0.7, TOTAL);
  flash.style.background = end > 0 ? `rgba(0,0,0,${end})` : `rgba(${fc},${fa})`;
  fx(T);
}

window.__render = render;
window.__firstBar = BAR;
window.__ready = ready(stage, [['500 48px Gar', 'A'], ['italic 500 48px Gar', 'A'], ['48px Paris', 'A'], ['48px Mukta', 'Aक'], ['600 48px Mukta', 'Aक'], ['48px Rozha', 'ॐ मंगलं']], TOTAL);
