<script src="../../lib/core.js"></script>
<script>
const D = window.__DATA;
const stage = document.querySelector('#stage');
// Choreographed at 96 BPM, the Hindu wedding song the other films use. The template's own General
// song is only 28 seconds, shorter than the film.
const BEAT = 60 / 96, BAR = 4 * BEAT;

// ---- The template's palette and type ----
const BG = '#faf3f0', BLUSH = '#f5e6e4', CREAM = '#fff9f5', PAPER = '#fffaf8';
const RED = '#8b2942', REDS = '#c45c6a', REDD = '#6b1d32', GOLD = '#c9a86c', LGOLD = '#ecd6a4', INK = '#4a2c32', INKS = '#7a5a60';
const FB = ',Mukta,Naskh';
const RING = `Allura${FB}`, VIBES = `Vibes${FB}`, PLAY = `Play${FB}`, BODY = `Corm${FB}`, SANS = `Nun${FB}`;
const ART = 'https://pub-da9e4ff58a2b4062a77df0109c7d7c6f.r2.dev/asset/invitation-templates/template%203/assets/images/';

// ---- Data, used exactly as saved. A section with nothing in it is left out. ----
const val = (v) => str(v).trim().replace(/\s+/g, ' ');
const groom = val(D?.couple?.groomName), bride = val(D?.couple?.brideName);
const gPre = val(D?.couple?.groomParentPrefix), gPar = val(D?.couple?.groomParentsName);
const bPre = val(D?.couple?.brideParentPrefix), bPar = val(D?.couple?.brideParentsName);
const parseDate = (v) => {
  const s = str(v).trim();
  if (!s) return null;
  const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? `${s}T00:00:00` : s);
  return Number.isNaN(d.getTime()) ? null : d;
};
const date = parseDate(D?.ceremony?.date);
const time = val(D?.ceremony?.time);
const left = date ? Math.max(0, Math.floor((date.getTime() - window.__NOW) / 1000)) : 0;
const FIN = [Math.floor(left / 86400), Math.floor((left % 86400) / 3600), Math.floor((left % 3600) / 60), left % 60];
const quote = val(D?.ceremony?.quote), message = val(D?.ceremony?.invitationMessage);
const address = val(D?.venue?.address);
const list = (v) => (Array.isArray(v) ? v : []);
// An event needs its title; the template shows up to four polaroids.
const events = list(D?.timeline?.items).map((it) => ({ title: val(it?.title), time: val(it?.time) })).filter((e) => e.title).slice(0, 8);
const captions = list(D?.gallery?.items).map((it) => val(it?.caption)).filter(Boolean).slice(0, 4);

// ---- The cut list: whole bars, so any section may follow any and stay on the beat. ----
const SEGS = [];
const add = (key, dur, enter) => SEGS.push({ key, dur, enter });
add('env', BAR, null);
add('hero', 2 * BAR, 'panels');
if (quote) add('quote', quote.length > 100 ? 2 * BAR : BAR, 'rose');
if (date) add('date', BAR, 'scroll');
if (gPar || bPar) add('details', BAR, 'frame');
if (events.length) add('timeline', events.length > 4 ? 2 * BAR : BAR, 'thread');
if (address) add('venue', BAR, 'pin');
if (left > 0 || captions.length) add('count', BAR, 'swing');
if (message) add('message', message.length > 110 ? 2 * BAR : BAR, 'petals');
add('end', 6 * BEAT, 'bloom');
let acc = 0;
SEGS.forEach((s) => { s.start = acc; acc += s.dur; });
const TOTAL = acc;
const TR = { panels: 0.72, rose: 0.6, scroll: 0.6, frame: 0.55, thread: 0.6, pin: 0.55, swing: 0.7, petals: 0.6, bloom: 0.35 };

// ---- Helpers ----
const R = {};
// User text. Arabic-script names (Urdu, Arabic) stay one piece, because splitting them into letters
// breaks the joins between them.
const RTL = /[֐-ࣿיִ-﻿]/;
function T(parent, value, css, maxW) {
  const s = str(value);
  if (!RTL.test(s)) return text(parent, s, css, maxW);
  const e = text(parent, '', `${css};direction:rtl`, maxW);
  const sp = document.createElement('span');
  sp.textContent = s;
  e.appendChild(sp);
  e._l = [sp];
  return e;
}
function lines(value, max, count) {
  const out = [];
  for (const w of str(value).trim().split(/\s+/).filter(Boolean)) {
    const last = out[out.length - 1];
    if (last !== undefined && (last + ' ' + w).length <= max) out[out.length - 1] = `${last} ${w}`;
    else out.push(w);
  }
  if (out.length > count) { out.length = count; out[count - 1] = out[count - 1].replace(/[,.;:!?]*$/, '') + '…'; }
  return out;
}
// A paragraph in even lines, so no word is left alone on the last one.
function para(value, max, count) {
  const s = str(value).trim();
  const n = Math.ceil(s.length / max);
  return n > count ? lines(s, max, count) : wrap(s, Math.max(1, n), 1);
}
// The template's cream page with its soft rose corners.
function cream(sc) {
  return mk(sc, 'div', `width:1080px;height:1920px;background:radial-gradient(ellipse at 85% 10%,#fde8e8,transparent 40%),radial-gradient(ellipse at 12% 88%,#fde8e8,transparent 42%),linear-gradient(180deg,${CREAM} 0%,${BG} 100%)`);
}
// The template's deep wine sections, with their faint grid.
function wine(sc) {
  mk(sc, 'div', 'width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 30%,#7a1f38 0%,#5a1528 55%,#3d0f1a 100%)');
  return mk(sc, 'div', 'width:1080px;height:1920px;opacity:.5;background-image:linear-gradient(rgba(255,210,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,210,220,.07) 1px,transparent 1px);background-size:44px 44px');
}
// Section title, rising with a rose rule drawn out beneath it.
function heading(sc, s, y, color = RED) {
  const h = text(sc, s, `font:600 96px ${PLAY};letter-spacing:3px;color:${color}`, 920);
  const l = mk(sc, 'div', `width:360px;height:2px;background:linear-gradient(90deg,transparent,${GOLD} 30%,${GOLD} 70%,transparent)`);
  const o = text(sc, '❦', `font:400 46px ${PLAY};color:${color === RED ? REDS : LGOLD}`);
  return (u, start = 0.1) => {
    const p = outC(seg(u, start, start + 0.6));
    P(h, { y: y + (1 - p) * 40, a: p, b: (1 - p) * 8 });
    P(l, { y: y + 82, a: seg(u, start + 0.25, start + 0.5) });
    l.style.transform += ` scaleX(${outC(seg(u, start + 0.25, start + 0.8))})`;
    P(o, { y: y + 82, s: Math.max(0.001, outB(seg(u, start + 0.4, start + 0.8), 2)), r: (1 - seg(u, start + 0.4, start + 0.8)) * -90 });
  };
}
function svg(parent, w, h, css = '') {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  s.setAttribute('class', 'a'); s.style.cssText = css;
  parent.appendChild(s);
  return s;
}
function path(s, d, stroke, width) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', stroke);
  p.setAttribute('stroke-width', width); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('pathLength', '1');
  p.style.strokeDasharray = '1 1';
  s.appendChild(p);
  return p;
}
const draw = (p, k) => { p.style.strokeDashoffset = String(1 - cl(k)); };
// A hand-drawn rectangle: the template's vine border.
function vineRect(x0, y0, x1, y1, wob, seed) {
  const r = rng(seed), pts = [];
  const side = (ax, ay, bx, by, n) => { for (let i = 0; i < n; i++) { const k = i / n; pts.push([lerp(ax, bx, k) + (r() - 0.5) * wob, lerp(ay, by, k) + (r() - 0.5) * wob]); } };
  side(x0, y1, x0, y0, 9); side(x0, y0, x1, y0, 6); side(x1, y0, x1, y1, 9); side(x1, y1, x0, y1, 6);
  pts.push(pts[0]);
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i];
    d += ` Q${px.toFixed(1)} ${py.toFixed(1)} ${((px + x) / 2).toFixed(1)} ${((py + y) / 2).toFixed(1)}`;
  }
  return d + ` L${pts[pts.length - 1][0].toFixed(1)} ${pts[pts.length - 1][1].toFixed(1)}`;
}
const fmt = (d, o) => d.toLocaleDateString('en-GB', o);

// ================= Scenes (in cut order, so a later scene draws over an earlier one) =================

// ---- The envelope: two panels meeting at a crease, held by the "Save the Date" seal ----
const panelGap = (p) => 600 * ioC(cl(p));
{
  const sc = scene(stage);
  mk(sc, 'div', `width:1080px;height:1920px;background:${BLUSH}`);
  const cam = mk(sc, 'div', 'width:1080px;height:1920px');
  // The envelope art is drawn once, then shown as two halves that part.
  const art = document.createElement('canvas');
  art.width = 1080; art.height = 1920;
  const g = art.getContext('2d');
  const base = g.createLinearGradient(0, 0, 0, 1920);
  base.addColorStop(0, '#fffdf9'); base.addColorStop(1, '#f5e6e4');
  g.fillStyle = base; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = 'rgba(160,110,110,.05)';
  for (let x = 0; x < 1080; x += 6) g.fillRect(x, 0, 2, 1920);
  // The bottom fold, a shade darker.
  g.fillStyle = 'rgba(214,170,165,.28)';
  g.beginPath(); g.moveTo(0, 1920); g.lineTo(540, 1180); g.lineTo(1080, 1920); g.closePath(); g.fill();
  // Soft creases from the corners, as on the template's cover.
  const crease = (ax, ay, bx, by) => {
    const lg = g.createLinearGradient(ax, ay, bx, by);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,.9)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = lg; g.lineWidth = 26; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    g.strokeStyle = 'rgba(190,140,140,.18)'; g.lineWidth = 2; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  };
  crease(0, 0, 540, 900); crease(1080, 0, 540, 900); crease(0, 1920, 540, 1180); crease(1080, 1920, 540, 1180);
  const half = (side) => {
    const c = mk(cam, 'canvas', '');
    c.width = 540; c.height = 1920;
    c.getContext('2d').drawImage(art, side * 540, 0, 540, 1920, 0, 0, 540, 1920);
    // A shadow along the inner edge, so the parting reads.
    const e = mk(c.parentNode, 'div', `width:60px;height:1920px;background:linear-gradient(${side ? 90 : 270}deg,rgba(90,30,40,.22),transparent)`);
    return [c, e];
  };
  const [L, LE] = half(0), [Rt, RE] = half(1);
  const creaseLine = mk(cam, 'div', 'width:2px;height:1920px;background:linear-gradient(180deg,transparent,rgba(160,100,100,.35) 20%,rgba(160,100,100,.35) 80%,transparent)');
  // The seal, in two halves that go with their panels.
  // Each half is cut from a box wide enough to keep the seal's shadow whole.
  const sealHalf = (side) => {
    const w = mk(cam, 'div', `width:440px;height:440px;clip-path:inset(0 ${side ? 0 : 220}px 0 ${side ? 220 : 0}px)`);
    mk(w, 'div', 'left:70px;top:70px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#9e2d4a 0%,#7a1f38 38%,#5a1528 72%,#3d0f1a 100%);box-shadow:0 18px 40px rgba(61,15,26,.45),inset 0 -8px 18px rgba(0,0,0,.35)');
    mk(w, 'div', 'left:94px;top:94px;width:246px;height:246px;border-radius:50%;border:3px solid rgba(252,232,236,.55)');
    [['Save', 72, 168], ['the', 40, 222], ['Date', 72, 272]].forEach(([s, f, y]) => {
      const l = mk(w, 'div', `left:0;width:440px;top:${y - f / 2}px;text-align:center;font:400 ${f}px/1 ${VIBES};color:#fce8ec`);
      l.textContent = s;
    });
    return w;
  };
  const sL = sealHalf(0), sR = sealHalf(1);
  const ring = mk(cam, 'div', `width:330px;height:330px;border-radius:50%;border:4px solid ${GOLD}`);
  // The tassel that the guest pulls.
  const tassel = mk(cam, 'div', 'width:120px;height:600px;transform-origin:50% 0');
  mk(tassel, 'div', `left:58px;top:0;width:4px;height:350px;background:linear-gradient(180deg,#5a1528,${GOLD})`);
  mk(tassel, 'div', 'left:34px;top:340px;width:52px;height:78px;border-radius:12px 12px 6px 6px;background:linear-gradient(90deg,#5a1528,#9e2d4a 45%,#5a1528)');
  mk(tassel, 'div', `left:30px;top:350px;width:60px;height:8px;border-radius:4px;background:${GOLD}`);
  for (let i = 0; i < 19; i++) mk(tassel, 'div', `left:${36 + i * 2.6}px;top:412px;width:2px;height:${150 + (i % 3) * 8}px;background:linear-gradient(180deg,#7a1f38,#5a1528);transform:rotate(${(9 - i) * 0.9}deg);transform-origin:50% 0`);
  const cap = text(sc, 'Pull the tassel to open', `font:600 40px ${SANS};letter-spacing:5px;color:${INKS}`, 900);
  R.env = { sc, f(u) {
    const p = seg(u, BAR, BAR + TR.panels), gap = panelGap(p);
    cam.style.transform = `scale(${1 + seg(u, 0, BAR) * 0.04 + inC(p) * 0.08})`;
    P(L, { x: 270 - gap, y: 960 }); P(LE, { x: 510 - gap, y: 960 });
    P(Rt, { x: 810 + gap, y: 960 }); P(RE, { x: 570 + gap, y: 960 });
    P(creaseLine, { y: 960, a: 1 - seg(u, BAR - 0.1, BAR + 0.1) });
    // The seal beats with the music, then is pulled apart on the first strong beat.
    const beatIn = u < BAR ? (u % BEAT) : 9;
    const pulse = 1 + 0.06 * Math.exp(-beatIn * 7);
    P(sL, { x: 540 - gap, y: 960, s: pulse }); P(sR, { x: 540 + gap, y: 960, s: pulse });
    P(ring, { y: 960, s: u < BAR ? 1 + (beatIn / BEAT) * 0.5 : 1, a: u < BAR ? (1 - beatIn / BEAT) * 0.75 : 0 });
    // The tassel sways, then is tugged on the last beat before the seal gives.
    const tug = outB(seg(u, 3 * BEAT, 3 * BEAT + 0.3), 2) * (1 - seg(u, 3 * BEAT + 0.35, BAR));
    tassel.style.transform = `translate(${150 - 60 - gap}px,${-10 + tug * 110}px) rotate(${Math.sin(u * 2.4) * 5 * (1 - tug)}deg)`;
    P(cap, { y: 1420, a: (0.6 + 0.4 * Math.sin(u * 3)) * (1 - seg(u, 3 * BEAT, 3 * BEAT + 0.3)) * seg(u, 0.1, 0.5) });
  } };
}

// ---- Hero: vine border, roses, Bismillah, the ring with the names, and the couple ----
{
  const sc = scene(stage);
  cream(sc);
  const cam = mk(sc, 'div', 'width:1080px;height:1920px');
  const frame = svg(cam, 1080, 1920);
  const v1 = path(frame, vineRect(34, 34, 1046, 1886, 10, 4), RED, 3);
  const v2 = path(frame, vineRect(48, 48, 1032, 1872, 8, 9), GOLD, 2.5);
  const dots = Array.from({ length: 22 }, (_, i) => {
    const k = i / 22, per = k * 4, s = Math.floor(per), f = per - s;
    const [x, y] = [[41, lerp(1879, 41, f)], [lerp(41, 1039, f), 41], [1039, lerp(41, 1879, f)], [lerp(1039, 41, f), 1879]][s];
    return mk(cam, 'div', `left:${x - 7}px;top:${y - 10}px;width:14px;height:20px;border-radius:50%;background:${i % 3 ? REDS : GOLD};transform-origin:50% 50%`);
  });
  const vine = im(cam, `${ART}red-3.png`, 340, 633, 'transform-origin:20% 0');
  const roses = im(cam, `${ART}red-1.png`, 470, 513, 'transform-origin:80% 20%');
  // The Ganesh invocation that opens a Hindu wedding card, with gold rules either side.
  const BY = 300;
  const ganesh = text(cam, '॥ श्री गणेशाय नमः ॥', `font:400 66px Rozha,Mukta;color:${RED}`, 640);
  const gl = mk(cam, 'div', `width:520px;height:2px;background:linear-gradient(90deg,transparent,${GOLD} 25%,${GOLD} 75%,transparent)`);
  const gd = mk(cam, 'div', `width:14px;height:14px;background:${GOLD}`);
  // The ring: its circle is centred in the image with a radius of 159px of 360.
  const RY = 810;
  const ring = im(cam, `${ART}red-ring-2.png`, 860, 860);
  // A long name takes two lines inside the ring rather than shrinking to nothing.
  const nameBlock = (name) => {
    const two = graphemes(name).length > 13 && /\s/.test(name);
    const fs = two ? 104 : 150;
    return { fs, two, els: (two ? wrap(name, 2, 1) : [name]).map((l) => T(cam, l, `font:400 ${fs}px ${RING};color:${RED}`, two ? 540 : 560)) };
  };
  const nG = nameBlock(groom);
  const amp = text(cam, '&', `font:italic 400 92px ${PLAY};color:${REDS}`);
  const nB = nameBlock(bride);
  // The couple stand at the bottom left; the figure's feet are at 643px of the image's 666.
  const CS = 640 / 375;
  const couple = im(cam, `${ART}red-gAndb.png`, 640, 1137, 'transform-origin:50% 100%');
  const glow = mk(cam, 'div', 'width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(253,232,232,.95),transparent 65%)');
  cam.insertBefore(glow, ring);
  R.hero = { sc, f(u) {
    // The camera settles in as the panels part, then drifts closer.
    const enter = seg(u, 0, TR.panels);
    cam.style.transform = `scale(${lerp(1.1, 1, outC(enter)) + seg(u, 1, 2 * BAR) * 0.035}) translateY(${seg(u, 1, 2 * BAR) * 14}px)`;
    draw(v1, seg(u, 0.25, 1.7)); draw(v2, seg(u, 0.4, 1.85));
    dots.forEach((d, i) => { const p = outB(seg(u, 1.6 + i * 0.03, 1.9 + i * 0.03), 2.5); d.style.transform = `scale(${Math.max(0.001, p)}) rotate(${i * 40}deg)`; });
    const vp = outC(seg(u, 0.25, 1.3));
    vine.style.transform = `translate(${-70 - (1 - vp) * 420}px,${-10}px) rotate(${Math.sin(u * 1.4) * 1.6}deg)`;
    const rp = outC(seg(u, 0.4, 1.4));
    roses.style.transform = `translate(${670 + (1 - rp) * 500}px,${-150 - (1 - rp) * 200}px) rotate(${(1 - rp) * 25 + Math.sin(u * 1.1 + 1) * 1.4}deg) scale(${lerp(0.8, 1, rp)})`;
    // The invocation is written in from the left, on the second beat.
    const bp = seg(u, BEAT, BEAT + 0.9);
    P(ganesh, { y: BY, a: cl(bp * 3), s: lerp(1.04, 1, outC(bp)) });
    ganesh.style.clipPath = `inset(-30% ${(1 - ioC(bp)) * 100}% -30% -5%)`;
    const lp = outC(seg(u, BEAT + 0.6, BEAT + 1.2));
    P(gl, { y: BY + 62, a: lp }); gl.style.transform += ` scaleX(${lp})`;
    P(gd, { y: BY + 62, r: 45, s: Math.max(0.001, outB(seg(u, BEAT + 0.8, BEAT + 1.2), 2.4)) });
    // The ring draws itself round, then turns slowly.
    const ringP = seg(u, 1.1, 2.3);

      c.v.style.fontSize = `${[92, 92, 92, 76, 62, 52][Math.min(c.v.textContent.length, 5)]}px`;
      P(c, { x: 180 + i * 240, y: CY, s: outB(p, 1.6) * (done ? 1 + 0.1 * Math.exp(-(u - settle[i]) * 9) : 1), a: cl(p * 3) });
    });
    if (rope) draw(rope, outC(seg(u, 0.1, 0.7)));
    // Each polaroid drops in on a beat and swings on its thread until it settles.
    pol.forEach((w, i) => {
      const at = 0.7 + i * (BEAT / 2), p = seg(u, at, at + 0.45), t = Math.max(0, u - at);
      const r = (i % 2 ? 1 : -1) * 14 * Math.exp(-t * 1.6) * Math.cos(t * 5.2) + Math.sin(u * 1.6 + i) * 1.5;
      const y = PY - (1 - outB(p, 1.2)) * 900;
      w.style.transform = `translate(${xs[i] - PW / 2}px,${y - PH / 2}px) rotate(${r}deg)`;
      w.style.opacity = cl(p * 4);
      const topY = counting ? CY + 110 : 520 + 120 * (1 - ((xs[i] - 540) / 560) ** 2);
      const pinX = xs[i] + Math.sin((r * Math.PI) / 180) * 60, pinY = y - PH / 2;
      lines2[i].setAttribute('d', `M${xs[i].toFixed(1)} ${topY.toFixed(1)} L${pinX.toFixed(1)} ${pinY.toFixed(1)}`);
      draw(lines2[i], p);
    });
  } };
}

// ---- The invitation message ----
{
  const sc = scene(stage);

}

// ---- End card ----

// ================= Transitions, each taken from the design =================
const deco = {
  petalRing: mk(stage, 'div', `border-radius:50%;border:6px solid ${REDS};box-shadow:0 0 0 3px ${GOLD},0 0 50px rgba(196,92,106,.55)`),
  rose: im(stage, `${ART}red-1.png`, 478, 522),
  rodT: mk(stage, 'div', 'width:1160px;height:60px;border-radius:30px;background:linear-gradient(180deg,#f3dba0,#c9a86c 45%,#8f6d32);box-shadow:0 10px 24px rgba(0,0,0,.45)'),
  rodB: mk(stage, 'div', 'width:1160px;height:60px;border-radius:30px;background:linear-gradient(180deg,#f3dba0,#c9a86c 45%,#8f6d32);box-shadow:0 -10px 24px rgba(0,0,0,.35)'),
  frame: mk(stage, 'div', `box-sizing:border-box;border:10px double ${GOLD};outline:3px solid ${REDS};outline-offset:6px`),
  thread: mk(stage, 'div', `width:6px;background:${RED};box-shadow:0 0 18px rgba(139,41,66,.6)`),
  ring: mk(stage, 'div', `border-radius:50%;border:10px solid ${RED};box-shadow:0 0 0 4px ${GOLD},0 0 40px rgba(139,41,66,.5)`),
  petals: (() => { const e = mk(stage, 'canvas', ''); e.width = 1080; e.height = 1920; return e; })(),
};
Object.values(deco).forEach((e) => { e.style.display = 'none'; });
const PETAL = ['#f0b8c2', '#e8909f', '#c45c6a', '#f5d0d6', '#8b2942'];
// One generator for all of them: generators seeded close together start out nearly the same.
const SW = rng(77);
const sweep = Array.from({ length: 140 }, (_, i) => ({ k: SW(), o: (SW() - 0.5) * 380 * SW(), w: 22 + SW() * 30, c: PETAL[i % 5], a: SW() * 6.28 }));
function transition(el, type, p) {
  el.style.clipPath = ''; el.style.opacity = ''; el.style.filter = ''; el.style.transformOrigin = '';
  if (!(p > 0 && p < 1)) return;
  const e = outC(p), show = (d) => { d.style.display = 'block'; return d; };
  if (type === 'panels') {
    const g = panelGap(p);
    el.style.clipPath = `inset(0 ${Math.max(0, 540 - g)}px 0 ${Math.max(0, 540 - g)}px)`;
  }
  if (type === 'rose') {
    // A rose blooms towards the camera and the quote opens behind it.
    const r = lerp(0, 1250, inC(p) * 0.3 + e * 0.7);
    el.style.clipPath = `circle(${r}px at 540px 960px)`;
    const g = show(deco.petalRing);
    g.style.width = g.style.height = `${r * 2}px`;
    P(g, { y: 960, a: 1 - p * 0.5 });
    P(show(deco.rose), { y: 960, s: lerp(0.3, 6, inC(p) * 0.5 + p * 0.5), r: p * 80, a: 1 - inC(p) });
  }
  if (type === 'scroll') {
    // The page unrolls like the template's scroll, between two gold rods.
    const h = lerp(0, 1980, ioC(p));
    el.style.clipPath = `inset(${960 - h / 2}px 0 ${960 - h / 2}px 0)`;
    P(show(deco.rodT), { y: 960 - h / 2 - 20, a: 1 - seg(p, 0.75, 1) });
    P(show(deco.rodB), { y: 960 + h / 2 + 20, a: 1 - seg(p, 0.75, 1) });
  }
  if (type === 'frame') {
    // The details card's double border opens out to the screen's edges.
    const w = lerp(300, 1080, e), h = lerp(400, 1920, e);
    el.style.clipPath = `inset(${(1920 - h) / 2}px ${(1080 - w) / 2}px round ${lerp(30, 0, e)}px)`;
    const f = show(deco.frame);
    f.style.width = `${w + 20}px`; f.style.height = `${h + 20}px`; f.style.borderRadius = `${lerp(36, 0, e)}px`;
    P(f, { y: 960, a: 1 - seg(p, 0.6, 1) });
  }
  if (type === 'thread') {
    // The timeline's thread drops down, and the page opens sideways from it.
    const d = seg(p, 0, 0.4), o = outC(seg(p, 0.3, 1));
    const t = show(deco.thread);
    t.style.height = `${Math.max(1, 1920 * outC(d))}px`;
    t.style.transform = `translate(207px,0)`;
    t.style.opacity = 1 - seg(p, 0.7, 1);
    el.style.clipPath = `inset(0 ${(1080 - 210) * (1 - o)}px 0 ${210 * (1 - o)}px)`;
  }
  if (type === 'pin') {
    const r = lerp(0, 1350, e);
    el.style.clipPath = `circle(${r}px at ${PIN.x}px ${PIN.y}px)`;
    const g = show(deco.ring);
    g.style.width = g.style.height = `${r * 2}px`;
    P(g, { x: PIN.x, y: PIN.y, a: 1 - p * 0.6 });
  }
  if (type === 'swing') {
    // The section swings down into place from the top, like the hanging polaroids.
    el.style.transformOrigin = '50% -200px';
    const r = -24 * Math.pow(1 - p, 2) * Math.cos(p * 8);
    el.style.transform = `translateY(${-(1 - outC(p)) * 600}px) rotate(${r}deg)`;
    el.style.filter = `drop-shadow(0 30px 40px rgba(0,0,0,${0.5 * (1 - p)}))`;
  }
  if (type === 'petals') {
    // A drift of petals sweeps across and leaves the message behind it.
    const x = lerp(-700, 2100, e);
    el.style.clipPath = `polygon(0 0,${x}px 0,${x - 900}px 1920px,0 1920px)`;
    const c = show(deco.petals), g = c.getContext('2d');
    g.clearRect(0, 0, 1080, 1920);
    for (const s of sweep) {
      const yy = s.k * 1920, xx = x - 900 * s.k + s.o;
      g.save(); g.translate(xx, yy); g.rotate(s.a + p * 6); g.scale(1, 0.55);
      g.fillStyle = s.c; g.beginPath(); g.ellipse(0, 0, s.w, s.w * 0.7, 0, 0, 6.3); g.fill(); g.restore();
    }
  }
  if (type === 'bloom') el.style.opacity = cl(p * 1.6);
}

// ================= Petals on the cream pages, gold dust on the wine ones =================
const cv = document.createElement('canvas');
cv.width = 1080; cv.height = 1920;
stage.appendChild(cv);
const c = cv.getContext('2d');
mk(stage, 'div', 'width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 46%,transparent 62%,rgba(60,15,26,.32) 100%)');
const flash = mk(stage, 'div', 'width:1080px;height:1920px');
const RN = rng(41);
const petals = Array.from({ length: 34 }, () => ({ x: RN() * 1080, y: RN() * 2200, v: 110 + RN() * 140, sw: 30 + RN() * 60, f: 0.5 + RN() * 1.1, p: RN() * 6.28, w: 10 + RN() * 10, c: PETAL[Math.floor(RN() * 4)], rs: 1 + RN() * 2.5 }));
const dust = Array.from({ length: 70 }, () => ({ x: RN() * 1080, y: RN() * 1920, v: 20 + RN() * 50, r: 1 + RN() * 2.6, p: RN() * 6.28, f: 1 + RN() * 3 }));
const WINE_SCENES = new Set(['date', 'count', 'end']);

function fx(T) {
  c.clearRect(0, 0, 1080, 1920);
  const now = SEGS.find((s) => T >= s.start && T < s.start + s.dur) || SEGS[SEGS.length - 1];
  if (WINE_SCENES.has(now.key)) {
    for (const d of dust) {
      const y = (d.y - T * d.v + 1920 * 4) % 1920, tw = 0.4 + 0.6 * Math.abs(Math.sin(T * d.f + d.p));
      c.fillStyle = `rgba(236,214,164,${0.7 * tw})`;
      c.beginPath(); c.arc(d.x + Math.sin(T + d.p) * 10, y, d.r, 0, 6.3); c.fill();
    }
    return;
  }
  // The template's falling petals; they gather pace once the invitation is open.
  const a = now.key === 'env' ? 0.55 : 0.85;
  c.globalAlpha = a;
  for (const p of petals) {
    const y = (p.y + T * p.v) % 2200 - 140, x = p.x + Math.sin(T * p.f + p.p) * p.sw, sq = 0.3 + 0.7 * Math.abs(Math.sin(T * p.rs + p.p));
    c.save(); c.translate(x, y); c.rotate(T * p.rs * 0.6 + p.p); c.scale(1, sq);
    c.fillStyle = p.c; c.beginPath(); c.ellipse(0, 0, p.w, p.w * 0.62, 0, 0, 6.3); c.fill();
    c.restore();
  }
  c.globalAlpha = 1;
}

const FLASH_COL = { panels: '255,244,236', rose: '255,226,232', scroll: '255,236,200', frame: '255,246,236', thread: '255,232,236', pin: '255,236,236', swing: '255,226,232', petals: '255,232,236', bloom: '255,226,232' };

function render(T) {
  T = cl(T, 0, TOTAL);
  const beat = T >= BAR ? (T - BAR) % BEAT : 9;
  stage.style.transform = `scale(${1 + 0.01 * Math.exp(-beat * 7)})`;
  Object.values(deco).forEach((e) => { e.style.display = 'none'; });
  SEGS.forEach((s, i) => {
    const u = T - s.start, next = SEGS[i + 1];
    const on = u >= 0 && (u < s.dur + (next ? TR[next.enter] : 0) || i === SEGS.length - 1);
    const sc = R[s.key].sc;
    sc.style.display = on ? 'block' : 'none';
    if (!on) return;
    sc.style.transform = '';
    R[s.key].f(u, s);
    if (s.enter) transition(sc, s.enter, seg(u, 0, TR[s.enter]));
  });
  let fa = 0, fc = '255,255,255';
  SEGS.forEach((s) => {
    if (!s.enter) return;
    const u = T - s.start, pk = s.enter === 'panels' || s.enter === 'bloom' ? 0.7 : 0.4;
    const v = u < 0 ? (u > -0.08 ? pk * (1 + u / 0.08) : 0) : pk * Math.exp(-u * 7);
    if (v > fa) { fa = v; fc = FLASH_COL[s.enter]; }
  });
  const end = seg(T, TOTAL - 0.7, TOTAL);
  flash.style.background = end > 0 ? `rgba(0,0,0,${end})` : `rgba(${fc},${fa})`;
  fx(T);
}

window.__render = render;
window.__firstBar = BAR;
window.__ready = ready(stage, [['48px Allura', 'A'], ['48px Vibes', 'A'], ['600 48px Play', 'A'], ['italic 48px Play', 'A'], ['500 48px Corm', 'A'], ['italic 500 48px Corm', 'A'], ['700 48px Nun', 'A'], ['48px Mukta', 'Aक'], ['600 48px Mukta', 'Aक'], ['48px Naskh', 'ب'], ['48px Rozha', 'श्री']], TOTAL);
