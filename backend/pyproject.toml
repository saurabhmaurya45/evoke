[project]
name = "evoke-backend"
version = "0.1.0"
description = "Evoke backend — event/wedding invitation platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "bleach>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated, frozen historical artifacts — not hand-maintained, so not linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "BLE", "RUF"]
ignore = [
    # FastAPI's own dependency injection idiom (`= Depends(...)` in a
    # parameter default) — that's the framework's intended pattern, not a bug.
    "B008",
    # `class X(str, enum.Enum)` -> `enum.StrEnum` is a style preference, not a
    # bug; every enum model uses the str+Enum form deliberately (SQLAlchemy
    # `Enum(...)` columns and Pydantic both key off it), so a repo-wide base-
    # class rewrite isn't worth the churn/risk for this alone.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
