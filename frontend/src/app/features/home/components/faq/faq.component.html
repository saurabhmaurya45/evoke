<section id="faq" class="faq">
  <app-section-aura tone="clay" />
  <app-section-heading appReveal eyebrow="FAQ" title="Questions, answered" accent="#c97b63" />

  <div class="faq__list" appReveal revealStagger>
    @for (item of content.faqs; track item.question; let i = $index) {
      <div class="faq__item" [class.is-open]="openIndex() === i">
        <h3 class="faq__heading">
          <button
            type="button"
            class="faq__trigger"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-panel-' + i"
            [id]="'faq-trigger-' + i"
            (click)="toggle(i)"
          >
            {{ item.question }}
            <span class="faq__icon" aria-hidden="true">＋</span>
          </button>
        </h3>
        <div
          class="faq__panel"
          [id]="'faq-panel-' + i"
          role="region"
          [attr.aria-labelledby]="'faq-trigger-' + i"
        >
          <p class="faq__answer">{{ item.answer }}</p>
        </div>
      </div>
    }
  </div>
</section>
