<section id="templates" class="templates">
  <app-section-aura tone="clay" />
  <app-section-heading
    appReveal
    eyebrow="Templates"
    title="Wedding invitations"
    subtitle="Choose a beautifully crafted design and make it yours."
    accent="#c97b63"
  />

  <div class="carousel" appReveal>
    <button
      type="button"
      class="carousel__nav carousel__nav--prev"
      aria-label="Previous templates"
      [disabled]="atStart()"
      (click)="scrollBy(-1)"
    >
      ‹
    </button>

    <div
      class="carousel__track"
      #track
      (scroll)="onScroll()"
      tabindex="0"
      aria-label="Template carousel"
    >
      @for (tpl of templates(); track tpl.slotId) {
        <article class="tcard" [style.--accent]="tpl.accent">
          <!-- Phone-shaped preview: the template's real opening, recorded on a phone.
               Only cards on screen play (see TemplatesSectionComponent). -->
          <a
            class="tcard__phone"
            [routerLink]="['/templates', slug(tpl)]"
            [attr.aria-label]="tpl.name + ' — ' + label(tpl) + ' invitation template'"
          >
            <video
              #vid
              class="tcard__media"
              [poster]="tpl.phonePoster ?? tpl.previewPoster ?? tpl.photo"
              aria-hidden="true"
              muted
              loop
              playsinline
              preload="none"
              width="360"
              height="778"
            >
              <source [src]="tpl.phoneVideo ?? tpl.previewVideo" type="video/mp4" />
            </video>
          </a>

          <div class="tcard__body">
            <span class="tcard__label">{{ label(tpl) }}</span>
            <h3 class="tcard__name">
              <a [routerLink]="['/templates', slug(tpl)]">{{ shortName(tpl) }}</a>
            </h3>
            @if (pricesKnown()) {
              <span class="tcard__price" [class.tcard__price--free]="tpl.pricing === 'free'">{{
                price(tpl)
              }}</span>
            }
            <div class="tcard__actions">
              <a
                class="tcard__btn tcard__btn--ghost"
                [routerLink]="['/preview', tpl.slotId]"
                [attr.aria-label]="'Preview the ' + tpl.name + ' template'"
                >Preview</a
              >
              <a
                class="tcard__btn tcard__btn--solid"
                [routerLink]="['/preview', tpl.slotId]"
                [queryParams]="{ mode: 'use' }"
                [attr.aria-label]="'Use the ' + tpl.name + ' template'"
                >Use</a
              >
            </div>
          </div>
        </article>
      }
    </div>

    <button
      type="button"
      class="carousel__nav carousel__nav--next"
      aria-label="More templates"
      [disabled]="atEnd()"
      (click)="scrollBy(1)"
    >
      ›
    </button>
  </div>

  <div class="templates__more" appReveal>
    <a class="templates__more-link" routerLink="/templates"
      >View all {{ templates().length }} templates →</a
    >
  </div>
</section>
