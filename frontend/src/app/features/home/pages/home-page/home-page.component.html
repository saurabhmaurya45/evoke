<!-- Above the fold — render eagerly for fast LCP. -->
<app-hero />
<app-stats />

<!-- Templates right after the hero: the designs are what visitors came for.
     Deferred until near the viewport — its preview clips aren't needed for
     the first paint. The placeholder carries id="templates" so the hero's
     "Browse Templates" (#templates) link works before the section loads. -->
@defer (on viewport) {
  <app-templates-section />
} @placeholder {
  <div id="templates" class="section-skeleton" aria-hidden="true"></div>
}

<app-services-section />
<app-how-it-works />

<!-- Below the fold — hydrate on scroll to trim the initial payload. -->

<!-- Rendered eagerly so its text is in the prerendered HTML: feature keywords are
     what this page ranks for. -->
<app-features-section />

@defer (on viewport) {
  <app-comparison />
} @placeholder {
  <div class="section-skeleton" aria-hidden="true"></div>
}

@defer (on viewport) {
  <app-testimonials />
} @placeholder {
  <div class="section-skeleton" aria-hidden="true"></div>
}

<!-- Rendered eagerly: FAQPage structured data must match answers visible in the
     static HTML, and a @defer placeholder would leave them out. -->
<app-faq />

@defer (on viewport) {
  <app-cta />
} @placeholder {
  <div class="section-skeleton" aria-hidden="true"></div>
}
