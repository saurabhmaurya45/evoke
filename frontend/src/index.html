<!doctype html>
<!-- en-IN: the customer base is India, so regional English is the honest signal. --><html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Evoke — Create Beautiful Invitation Websites in Minutes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Evoke is the premium platform for creating personalized invitation websites — weddings, engagements, and every occasion in life."
    />
    <meta name="theme-color" content="#15120e" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Preload the hero art so the LCP image starts fetching immediately. -->
    <link rel="preload" as="image" href="assets/images/image-1.jpg" fetchpriority="high" />

    <!-- Apply the persisted theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('evoke.theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
