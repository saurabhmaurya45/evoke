<!doctype html>
<!-- en-IN: the customer base is India, so regional English is the honest signal. --><html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>theinvitely.in — Create Beautiful Invitation Websites in Minutes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="theinvitely.in is the premium platform for creating personalized invitation websites — weddings, engagements, and every occasion in life."
    />
    <meta name="theme-color" content="#15120e" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Preload the hero art so the LCP image starts fetching immediately. -->
    <link rel="preload" as="image" href="/invitation-templates/template%201/preview-desktop.jpg" fetchpriority="high" />

    <!-- Dark by default. Light only if the visitor has chosen it. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theinvitely.theme');
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
